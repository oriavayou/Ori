import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// =====================================================================
//  Constants
// =====================================================================
const W = 1080, H = 1920, DURATION = 10;
const SAFE = { top: 250, bottom: H - 350, left: 80, right: W - 80 };
const MOTION_MARGIN = 34;              // extra px kept free while the camera moves
const FOV = 32;
const GRAVITY = 14;
const params = new URLSearchParams(location.search);
if (params.has('guides')) document.getElementById('guides').classList.add('on');

const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);

// Deterministic PRNG. Used ONLY while building the scene.
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260930);
const rand = (a, b) => a + (b - a) * rng();

// Closed-form spring responses (no integration, no state).
function springStep(tau, omega, zeta = 1) {         // 0 -> 1 step response
  if (tau <= 0) return 0;
  if (zeta >= 1) return 1 - (1 + omega * tau) * Math.exp(-omega * tau);
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  const e = Math.exp(-zeta * omega * tau);
  return 1 - e * (Math.cos(wd * tau) + (zeta * omega / wd) * Math.sin(wd * tau));
}
function springImpulse(tau, omega, zeta) {          // starts at 0, decays to 0
  if (tau <= 0) return 0;
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  return Math.exp(-zeta * omega * tau) * Math.sin(wd * tau);
}

// Monotone cubic (Fritsch–Carlson) through knots, starting from rest.
function monotoneCubic(xs, ys, endSlope) {
  const n = xs.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = 0;
  m[n - 1] = Math.min(endSlope, 3 * d[n - 2]);
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) { m[i] = 0; continue; }
    const h0 = xs[i] - xs[i - 1], h1 = xs[i + 1] - xs[i];
    const w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
    m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (x - xs[i]) / h;
    const u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i]
         + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
  };
}

// =====================================================================
//  Renderer / scene / lights
// =====================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const BG = new THREE.Color('#D9E8F4');
scene.background = BG;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 300);

scene.add(new THREE.HemisphereLight('#ffffff', '#eadfe4', 0.85));

const keyLight = new THREE.DirectionalLight('#fff4ec', 2.3);          // big soft key
keyLight.position.set(-5.5, 10, 7);
keyLight.target.position.set(0.6, 1.8, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -12, right: 12, top: 12, bottom: -10, near: 1, far: 50 });
keyLight.shadow.radius = 7;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight, keyLight.target);

const fillLight = new THREE.DirectionalLight('#eaf1ff', 0.55);       // weak fill
fillLight.position.set(8, 3, 5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight('#ffffff', 1.5);          // subtle rim
rimLight.position.set(3, 6, -9);

// Soft "infinite floor": only shadows + a very gentle pool of tone.
function radialTexture(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  for (const [o, a] of stops) gr.addColorStop(o, `rgba(255,255,255,${a})`);
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
// =====================================================================
//  Kid's room: a light-wood kids' desk (top surface at y = 0) against a pastel wall.
//  Everything sits BEHIND the pig so the lower frame stays clean for the headline.
// =====================================================================
const ROOM = { wallZ: -5.6, deskBack: -5.2, deskFront: 13 };
const RM = {
  desk: new THREE.MeshStandardMaterial({ color: '#F0DCC0', roughness: 0.55, envMapIntensity: 0.45 }),
  wall: new THREE.MeshStandardMaterial({ color: '#D9E8F4', roughness: 0.95, envMapIntensity: 0.25 }),
  white: new THREE.MeshStandardMaterial({ color: '#FBFAF6', roughness: 0.55, envMapIntensity: 0.5 }),
  coral: new THREE.MeshStandardMaterial({ color: '#F2A08A', roughness: 0.6 }),
  lemon: new THREE.MeshStandardMaterial({ color: '#F5D36A', roughness: 0.55 }),
  sky: new THREE.MeshStandardMaterial({ color: '#8CC0E8', roughness: 0.55 }),
  lilac: new THREE.MeshStandardMaterial({ color: '#C2AFE4', roughness: 0.6 }),
  peach: new THREE.MeshStandardMaterial({ color: '#F7C49A', roughness: 0.6 }),
  navy: new THREE.MeshStandardMaterial({ color: '#5A6C94', roughness: 0.6 }),
  wood: new THREE.MeshStandardMaterial({ color: '#F1C891', roughness: 0.7 }),
  string: new THREE.MeshStandardMaterial({ color: '#E6DED2', roughness: 0.9 }),
};
function addMesh(geo, mat, pos, rot, { cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  m.castShadow = cast; m.receiveShadow = receive;
  scene.add(m);
  return m;
}
const rbox = (w, h, d, r = 0.06) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2.2, h / 2.2, d / 2.2));
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}

// desk top + wall
addMesh(rbox(17.2, 0.5, ROOM.deskFront - ROOM.deskBack, 0.14), RM.desk, [0, -0.25, (ROOM.deskFront + ROOM.deskBack) / 2], null, { cast: false });
addMesh(new THREE.PlaneGeometry(44, 34), RM.wall, [0, 9, ROOM.wallZ], null, { cast: false });


// bunting garland across the top of the wall
{
  const x0 = -6.2, x1 = 7.2, yTop = 10.0, sag = 0.85, z = ROOM.wallZ + 0.12;
  const yAt = x => yTop - sag * (1 - Math.pow((x - (x0 + x1) / 2) / ((x1 - x0) / 2), 2));
  const pts = []; for (let k = 0; k <= 40; k++) { const x = lerp(x0, x1, k / 40); pts.push(new THREE.Vector3(x, yAt(x), z)); }
  addMesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, 0.025, 6), RM.string, null, null, { cast: false });
  const flag = new THREE.Shape(); flag.moveTo(-0.32, 0); flag.lineTo(0.32, 0); flag.lineTo(0, -0.78); flag.closePath();
  const flagGeo = new THREE.ShapeGeometry(flag);
  const cols = [RM.coral, RM.lemon, RM.sky, RM.lilac, RM.peach];
  let k = 0;
  for (let x = x0 + 0.5; x < x1 - 0.3; x += 0.92, k++) {
    const slope = (yAt(x + 0.01) - yAt(x - 0.01)) / 0.02;
    const m = addMesh(flagGeo, cols[k % cols.length], [x, yAt(x), z + 0.01], [0, 0, Math.atan(slope)], { cast: false });
    m.material = m.material.clone(); m.material.side = THREE.DoubleSide;
  }
}

// a child's drawing taped to the wall
{
  const drawRng = mulberry32(77);
  const art = canvasTexture(400, 300, (g, w, h) => {
    g.fillStyle = '#FFFEFA'; g.fillRect(0, 0, w, h);
    g.lineCap = 'round'; g.lineJoin = 'round';
    const scribble = (color, width, pts) => { g.strokeStyle = color; g.lineWidth = width; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x + drawRng() * 3, y + drawRng() * 3) : g.moveTo(x, y)); g.stroke(); };
    g.fillStyle = '#F6C945'; g.beginPath(); g.arc(320, 70, 34, 0, Math.PI * 2); g.fill();
    for (let a = 0; a < 8; a++) { const c = Math.cos(a * Math.PI / 4), s2 = Math.sin(a * Math.PI / 4); scribble('#F2B632', 6, [[320 + c * 46, 70 + s2 * 46], [320 + c * 66, 70 + s2 * 66]]); }
    scribble('#8CC0E8', 7, [[20, 250], [120, 238], [220, 252], [380, 240]]);
    g.fillStyle = '#F29A86'; g.fillRect(90, 150, 110, 90);

    g.fillStyle = '#F7D774'; g.fillRect(155, 190, 26, 50);
    scribble('#B79BE0', 5, [[40, 60], [70, 48], [100, 62]]);
  });
  const paper = addMesh(new THREE.PlaneGeometry(2.1, 1.58), new THREE.MeshStandardMaterial({ map: art, roughness: 0.9 }), [-2.75, 3.85, ROOM.wallZ + 0.02], [0, 0, 0.06], { cast: false });
  const tape = new THREE.MeshStandardMaterial({ color: '#F3E6B5', roughness: 0.8, transparent: true, opacity: 0.85 });
  addMesh(new THREE.PlaneGeometry(0.46, 0.16), tape, [-3.7, 4.55, ROOM.wallZ + 0.03], [0, 0, 0.5], { cast: false });
  addMesh(new THREE.PlaneGeometry(0.46, 0.16), tape, [-1.72, 4.68, ROOM.wallZ + 0.03], [0, 0, -0.35], { cast: false });
}

// wall shelf on the left (the wall behind the graph stays clean): books + a toy rocket
{
  const y = 5.55, z = ROOM.wallZ + 0.55;

  const books = [[-3.95, 0.36, 1.75, RM.coral, 0], [-3.57, 0.4, 1.55, RM.sky, 0], [-3.17, 0.34, 1.9, RM.lemon, 0], [-2.68, 0.38, 1.6, RM.lilac, -0.3]];
  for (const [x, w, h, mat, tilt] of books) addMesh(rbox(w, h, 0.9, 0.05), mat, [x + (tilt ? 0.25 : 0), y + 0.1 + h / 2 * Math.cos(tilt) - (tilt ? 0.03 : 0), z], [0, 0, tilt]);
  // rocket
  const rx = -1.3, ry = y + 0.1;

  addMesh(body, RM.white, [rx, ry + 0.12, z]);
  addMesh(new THREE.ConeGeometry(0.27, 0.55, 32), RM.coral, [rx, ry + 1.52, z]);
  addMesh(new THREE.CylinderGeometry(0.11, 0.11, 0.06, 24), RM.sky, [rx, ry + 0.95, z + 0.3], [Math.PI / 2, 0, 0]);
  for (let a = 0; a < 3; a++) {
    const ang = a * 2 * Math.PI / 3 + 0.4;
    addMesh(rbox(0.06, 0.5, 0.36, 0.02), RM.lemon, [rx + Math.cos(ang) * 0.34, ry + 0.3, z + Math.sin(ang) * 0.34], [0, -ang, 0]);
  }
}


// stack of books on the desk (left, behind the pig)
{
  const stack = [[2.1, 0.34, 1.45, RM.navy, 0.05], [1.9, 0.3, 1.35, RM.coral, -0.1], [1.75, 0.32, 1.3, RM.lemon, 0.14]];
  let y = 0;
  for (const [w, h, d, mat, rot] of stack) { addMesh(rbox(w, h, d, 0.05), mat, [-3.45, y + h / 2, -3.7], [0, rot, 0]); y += h; }
  addMesh(new THREE.SphereGeometry(0.34, 32, 20), RM.sky, [-3.3, y + 0.34, -3.65]);
}

// pencil cup (right, behind the pig)
{
  const cx = 3.9, cz = -3.3;
  const cup = addMesh(new THREE.CylinderGeometry(0.5, 0.46, 1.3, 40, 1, true), RM.sky.clone(), [cx, 0.65, cz]);
  cup.material.side = THREE.DoubleSide;
  addMesh(new THREE.CylinderGeometry(0.46, 0.46, 0.06, 40), RM.sky, [cx, 0.03, cz]);
  const cols = [RM.coral, RM.lemon, RM.lilac, RM.navy, RM.peach];
  cols.forEach((mat, i) => {
    const a = i * 2 * Math.PI / cols.length, tilt = 0.16;
    const g = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 1.8, 6), mat); shaft.position.y = 0.9;
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.065, 0.24, 6), RM.wood); tip.position.y = 1.92;
    const lead = new THREE.Mesh(new THREE.ConeGeometry(0.022, 0.08, 6), RM.navy); lead.position.y = 2.04;
    for (const m of [shaft, tip, lead]) { m.castShadow = true; m.receiveShadow = true; g.add(m); }
    g.position.set(cx + Math.cos(a) * 0.2, 0.1 + (i % 2) * 0.12, cz + Math.sin(a) * 0.2);
    g.rotation.set(Math.sin(a) * tilt, 0, -Math.cos(a) * tilt);
    scene.add(g);
  });
}

// =====================================================================
//  Materials (clean, glossy, no textures)
// =====================================================================
const M = {
  pink: new THREE.MeshPhysicalMaterial({ color: '#F6A3BA', roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.09, envMapIntensity: 0.9 }),
  pinkInner: new THREE.MeshStandardMaterial({ color: '#C9687F', roughness: 0.7, envMapIntensity: 0.35 }),
  pinkEdge: new THREE.MeshStandardMaterial({ color: '#EE98AE', roughness: 0.55, envMapIntensity: 0.6 }),
  snout: new THREE.MeshPhysicalMaterial({ color: '#EC7E9D', roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.9 }),
  earInner: new THREE.MeshPhysicalMaterial({ color: '#EC839F', roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  nostril: new THREE.MeshStandardMaterial({ color: '#A8465F', roughness: 0.6 }),
  eye: new THREE.MeshPhysicalMaterial({ color: '#221920', roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.05 }),
  slot: new THREE.MeshStandardMaterial({ color: '#3A1C29', roughness: 0.92, envMapIntensity: 0.15 }),
  gold: new THREE.MeshPhysicalMaterial({ color: '#FFC94D', metalness: 0.92, roughness: 0.3, envMapIntensity: 2.1, clearcoat: 0.4, clearcoatRoughness: 0.15 }),
  green: new THREE.MeshPhysicalMaterial({ color: '#0CA24B', roughness: 0.26, clearcoat: 1, clearcoatRoughness: 0.06,
                                         emissive: '#06592A', emissiveIntensity: 0.3, envMapIntensity: 0.85 }),
};
// inner and edge faces never win a depth tie against the outer skin (keeps seams invisible)
for (const m of [M.pinkInner, M.pinkEdge]) Object.assign(m, { polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 6 });
const SHELL_MATS = [M.pink, M.pinkInner, M.pinkEdge];
M.greenSide = M.green.clone();
Object.assign(M.greenSide, { polygonOffset: true, polygonOffsetFactor: 1.5, polygonOffsetUnits: 4 });

// =====================================================================
//  Piggy bank — built from separate parts
// =====================================================================
const PIG = { cy: 1.1, sx: 1.3, sy: 1.05, sz: 1.05, thick: 0.065, yaw: -125 * DEG };
const LID_TH = 12 * 0.025, RING_TH = 26 * 0.025;       // lid cap / petal ring polar limits (on the shell grid)
const SLOT = { a: 0.2, r: 0.055, rimR: 0.085, tube: 0.024 };
const HOP_T = 0.42, HOP_H = 0.16;

function ellPoint(th, ph, k = 0, out = new THREE.Vector3()) {
  return out.set((PIG.sx - k) * Math.sin(th) * Math.cos(ph), PIG.cy + (PIG.sy - k) * Math.cos(th), (PIG.sz - k) * Math.sin(th) * Math.sin(ph));
}
function ellNormal(th, ph, k = 0, out = new THREE.Vector3()) {
  const sx = PIG.sx - k, sy = PIG.sy - k, sz = PIG.sz - k;
  const x = sx * Math.sin(th) * Math.cos(ph), y = sy * Math.cos(th), z = sz * Math.sin(th) * Math.sin(ph);
  return out.set(x / (sx * sx), y / (sy * sy), z / (sz * sz)).normalize();
}
const surfY = (x, z) => PIG.cy + PIG.sy * Math.sqrt(Math.max(0, 1 - (x / PIG.sx) ** 2 - (z / PIG.sz) ** 2));
function surfNormalXZ(x, z, out = new THREE.Vector3()) {
  const y = surfY(x, z) - PIG.cy;
  return out.set(x / PIG.sx ** 2, y / PIG.sy ** 2, z / PIG.sz ** 2).normalize();
}

// A shell patch of the ellipsoid with real thickness: outer, inner and edge faces.
// All pieces share one integer grid (theta = k * TH_STEP, phi = whole degrees), so the
// vertices on a shared seam are bit-identical and the intact shell has no hairline cracks.
const TH_STEP = 0.025;
const thK = (k0, k1) => Array.from({ length: k1 - k0 + 1 }, (_, i) => (k0 + i) * TH_STEP);
const degRange = (d0, d1) => Array.from({ length: d1 - d0 + 1 }, (_, i) => d0 + i);
const phOf = d => (((d % 360) + 360) % 360) * DEG;
function buildShell(ths, degs) {
  const nT = ths.length - 1, nP = degs.length - 1;
  const full = degs[nP] - degs[0] === 360;
  const pos = [], nor = [], index = [], groups = [];
  let vc = 0;
  const add = (p, n) => { pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z); return vc++; };
  const P = new THREE.Vector3(), N = new THREE.Vector3();
  const needsFlip = (A, B, C, expected) => new THREE.Vector3().subVectors(C, A).cross(new THREE.Vector3().subVectors(B, A)).dot(expected) < 0;
  const quad = (a, b, c, d, flip) => { if (!flip) index.push(a, c, b, b, c, d); else index.push(a, b, c, b, d, c); };

  for (const [k, outward, mat] of [[0, true, 0], [PIG.thick, false, 1]]) {
    const start = index.length, base = vc;
    for (let i = 0; i <= nT; i++) for (let j = 0; j <= nP; j++) {
      const th = ths[i], ph = phOf(degs[j]);
      ellPoint(th, ph, k, P); ellNormal(th, ph, k, N); if (!outward) N.negate(); add(P, N);
    }
    const mi = Math.max(1, Math.floor(nT / 2)), mj = Math.floor(nP / 2);
    const E = ellNormal(ths[mi], phOf(degs[mj]), k); if (!outward) E.negate();
    const flip = needsFlip(ellPoint(ths[mi], phOf(degs[mj]), k), ellPoint(ths[mi], phOf(degs[mj + 1]), k), ellPoint(ths[mi + 1], phOf(degs[mj]), k), E);
    for (let i = 0; i < nT; i++) for (let j = 0; j < nP; j++) {
      const a = base + i * (nP + 1) + j; quad(a, a + 1, a + nP + 1, a + nP + 2, flip);
    }
    groups.push([start, index.length - start, mat]);
  }

  const edgeStart = index.length;

// =====================================================================
//  Automated checks over all 600 output frames
// =====================================================================
// Exact screen extents of the pig: project its real (sub-sampled) vertices.
function pigScreenBox(cam) {
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity }, v = new THREE.Vector3(), q = {};
  pigRoot.traverse(o => {
    if (!o.isMesh || !o.visible) return;
    const pa = o.geometry.attributes.position;
    for (let i = 0; i < pa.count; i += 3) {
      toPx(v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld), cam, q);
      box.x0 = Math.min(box.x0, q.x); box.x1 = Math.max(box.x1, q.x); box.y0 = Math.min(box.y0, q.y); box.y1 = Math.max(box.y1, q.y);
    }
  });
  return box;
}
function runChecks() {
  const issues = [];
  const stats = { graphMinTop: Infinity, graphMaxRight: -Infinity, graphMinLeft: Infinity, piecesMin: { x: Infinity, y: Infinity }, piecesMax: { x: -Infinity, y: -Infinity } };
  for (let k = 0; k < 600; k++) {
    const t = k / 60;
    const st = applyState(t);
    // graph inside safe area
    for (const b of graphBounds(st.s)) {
      if (t < 5.0) break;
      const e = sphereExtents({ p: b.p.clone().sub(GRAPH_AXIS).multiplyScalar(graphBreath(t)).add(GRAPH_AXIS), r: b.r }, camera);
      stats.graphMinTop = Math.min(stats.graphMinTop, e.y0);
      stats.graphMaxRight = Math.max(stats.graphMaxRight, e.x1);
      stats.graphMinLeft = Math.min(stats.graphMinLeft, e.x0);
      if (e.y0 < SAFE.top || e.x1 > SAFE.right || e.x0 < SAFE.left) issues.push(`t=${t.toFixed(3)} graph outside safe area (${e.x0.toFixed(0)},${e.y0.toFixed(0)})-(${e.x1.toFixed(0)},${e.y1.toFixed(0)})`);
    }
    // flying pieces stay in frame
    for (const f of flyers) {
      if (t < f.launch) continue;
      const p = f.pivotLocal.clone().applyMatrix4(f.obj.matrix);
      const e = sphereExtents({ p, r: 0.3 }, camera);
      stats.piecesMin.x = Math.min(stats.piecesMin.x, e.x0); stats.piecesMin.y = Math.min(stats.piecesMin.y, e.y0);
      stats.piecesMax.x = Math.max(stats.piecesMax.x, e.x1); stats.piecesMax.y = Math.max(stats.piecesMax.y, e.y1);
      if (e.x0 < 0 || e.x1 > W || e.y0 < 0 || e.y1 > H) issues.push(`t=${t.toFixed(3)} ${f.kind} leaves frame`);
    }
    // pig fully in frame
    const pb = pigScreenBox(camera);
    stats.pigMin = { x: Math.min(stats.pigMin?.x ?? Infinity, pb.x0), y: Math.min(stats.pigMin?.y ?? Infinity, pb.y0) };
    stats.pigMax = { x: Math.max(stats.pigMax?.x ?? -Infinity, pb.x1), y: Math.max(stats.pigMax?.y ?? -Infinity, pb.y1) };
    if (pb.x0 < 0 || pb.x1 > W || pb.y0 < 0 || pb.y1 > H) issues.push(`t=${t.toFixed(3)} pig leaves frame (${pb.x0.toFixed(0)},${pb.y0.toFixed(0)})-(${pb.x1.toFixed(0)},${pb.y1.toFixed(0)})`);
    // coins never shrink before they are inside the slot
    for (const c of coins) {
      const cs = coinState(c, t);
      if (cs && cs.phase !== 'sink' && Math.abs(cs.scale - c.scale) > 1e-9) issues.push(`t=${t.toFixed(3)} coin ${c.i} shrinks before entry`);
    }
    // headline vs graph/pig overlap once visible
    if (t >= 8.5 && TEXT) {
      for (const b of graphBounds(st.s)) {
        const e = sphereExtents(b, camera);
        if (e.y1 > TEXT.box.top - 8 && e.x1 > TEXT.box.left && e.x0 < TEXT.box.right) issues.push(`t=${t.toFixed(3)} graph overlaps headline`);
      }
      if (pigBottomPx(camera) > TEXT.box.top - 8) issues.push(`t=${t.toFixed(3)} pig overlaps headline`);
    }
  }
  applyState(0);
  return { ok: issues.length === 0, issues: issues.slice(0, 40), issueCount: issues.length, stats, text: TEXT, camFinal: CAM_FINAL };
}

// =====================================================================
//  Boot: wait for the local font before the first frame
// =====================================================================
(async () => {
  await document.fonts.load('900 120px "Rubik Local"', 'הכסף שלך יכול לגדול');
  await document.fonts.ready;
  if (!document.fonts.check('900 120px "Rubik Local"', 'הכסף שלך יכול לגדול')) console.error('Rubik font NOT loaded');
  layoutHeadline();
  window.seek = seek;
  window.applyState = applyState;
  window.runChecks = runChecks;
  window.__info = () => ({ camFinal: CAM_FINAL, text: TEXT, L, flyers: flyers.map(f => ({ kind: f.kind, launch: f.launch, t1: f.t1, restH: f.restH })),
                          coins: coins.map(c => ({ i: c.i, tSpawn: c.tSpawn, tHit: c.tHit, S: c.S.toArray().map(v => +v.toFixed(2)) })) });
  seek(params.has('t') ? parseFloat(params.get('t')) : 0);
  window.__ready = true;
})();
</script>
