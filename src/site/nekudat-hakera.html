<title>מאזן</title>

<style>
/* מאזן — עיצוב מינימלי: לבן, אפור, צבע הדגשה אחד. עמודה אחת. */
:root{
  --ground:#ffffff; --surface:#ffffff; --surface-2:#f7f7f8; --sunk:#f2f3f5;
  --ink:#16181d; --ink-2:#2f333b; --muted:#6b7280; --faint:#9aa0a8;
  --line:#e3e5e8; --line-soft:#eef0f2;
  --accent:#0f5d4c; --accent-wash:#eaf3f0;
  --brass:var(--accent); --brass-soft:var(--accent); --brass-wash:var(--accent-wash);
  --petrol:var(--accent); --petrol-wash:var(--accent-wash);
  --good:var(--accent); --alert:#b42318; --alert-wash:#fdf1f0;
  --shadow:none; --shadow-lift:0 10px 30px rgba(0,0,0,.08);
  --r:8px; --r-lg:10px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:'Rubik',-apple-system,'Segoe UI',Arial,sans-serif;
  font-size:15px; line-height:1.6; direction:rtl; text-align:right}
h1,h2,h3,h4{font-family:'Rubik',Arial,sans-serif; font-weight:600; line-height:1.3; margin:0}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:780px; margin:0 auto; padding:0 16px}

/* כותרת עליונה */
.masthead{border-bottom:1px solid var(--line)}
.masthead-in{display:flex; align-items:center; height:56px}
.logo{display:inline-flex; align-items:center; gap:10px; font-weight:600; font-size:1rem; color:var(--ink); text-decoration:none}
.logo img{height:28px; width:auto; display:block}

/* כפתורים */
.btn{font:inherit; font-size:.92rem; font-weight:500; cursor:pointer; padding:9px 18px; min-height:40px;
  border-radius:var(--r); border:1px solid transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
.btn-primary,.btn-brass{background:var(--accent); color:#fff}
.btn-primary:hover,.btn-brass:hover{filter:brightness(.92)}
.btn-ghost{background:#fff; color:var(--ink); border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.link-btn{background:none; border:0; padding:0; color:var(--muted); font:inherit; font-size:.82rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.link-btn:hover{color:var(--ink)}

/* מסגרת */
#calc{padding:24px 0 96px}
#calc > .wrap > * + *{margin-top:16px}

/* שלבים */
.wizard-progress{display:flex; gap:6px; margin:0; padding:0; list-style:none; counter-reset:none}
.wizard-progress li{flex:1; cursor:pointer; font-size:.78rem; color:var(--faint); padding-top:8px; border-top:3px solid var(--line); text-align:right}
.wizard-progress li::before{content:attr(data-number) ". "}
.wizard-progress li.done{color:var(--muted); border-top-color:var(--accent)}
.wizard-progress li.current{color:var(--ink); font-weight:600; border-top-color:var(--accent)}

/* הנחיה לשלב */
.wizard-guide h3{font-size:1.15rem}
.wizard-guide .g-lead{color:var(--muted); font-size:.9rem; margin-top:4px}
.wizard-guide .g-badge,.wizard-guide ol,.wizard-guide .g-tip{display:none}

/* כרטיסים */
.wizard-mode,.wizard-case,.person{border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; background:var(--surface)}
.wizard-panel-title{font-size:.95rem; margin:0 0 10px}
.wizard-mode .wizard-panel-title + .field{margin-top:0}
.privacy-note{font-size:.78rem; color:var(--faint)}

/* בחירת מצב */
.mode-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.seg button{font:inherit; font-size:.88rem; color:var(--ink-2); background:#fff; border:0; padding:8px 16px; cursor:pointer}
.seg button + button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}

/* שדות */
.fields,.shared{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.8rem; color:var(--muted)}
.field .hint{font-size:.72rem; color:var(--faint); line-height:1.4}
input,select,textarea{font:inherit; font-size:.92rem; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:var(--r);
  padding:8px 10px; width:100%; min-width:0; min-height:40px; font-variant-numeric:tabular-nums}
textarea{line-height:1.6; resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-wash)}
input[type="date"]{direction:ltr; text-align:right}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:left 14px center,left 9px center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-left:28px}
input.needs,select.needs{border-color:var(--accent); background:var(--accent-wash)}
.wizard-invalid{border-color:var(--alert)!important; box-shadow:0 0 0 3px var(--alert-wash)!important}

/* חלקים מתקפלים */
details > summary{cursor:pointer; list-style:none}
details > summary::-webkit-details-marker{display:none}
.expert-block{border-top:1px solid var(--line-soft); padding-top:12px; margin-top:16px}
.expert-block > summary{font-size:.86rem; color:var(--muted)}
.expert-block > summary::before{content:"+ "; color:var(--accent)}
.expert-block[open] > summary::before{content:"− "}
.expert-block .shared{margin-top:12px}

/* העלאת דוח המסלקה */
.intake{display:grid; gap:16px}
.drop{border:1.5px dashed var(--line); border-radius:var(--r-lg); padding:24px 20px; text-align:center; background:var(--surface-2)}
.drop.over{border-color:var(--accent); background:var(--accent-wash)}
.drop.done{border-style:solid; border-color:var(--line); background:#fff; text-align:right; padding:18px 20px}
.drop .d-tag,.person-tag{font-size:.72rem; font-weight:600; color:var(--accent)}
.drop h4{font-size:1rem; margin-top:4px}
.drop .d-hint{font-size:.82rem; color:var(--muted); margin-top:4px}
.drop .btn{margin-top:12px}
.drop input[type=file]{display:none}
.intake-sum{margin-top:12px; border-top:1px solid var(--line-soft)}
.i-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:.86rem}
.i-row .i-name{font-weight:500; min-width:0}
.i-row .i-sub{display:block; font-size:.74rem; color:var(--muted); font-weight:400; margin-top:2px}
.i-row .i-val{flex:none; max-width:48%; text-align:left; font-weight:600; font-variant-numeric:tabular-nums}
.i-row .i-val .i-sub{text-align:left}
.i-skip{color:var(--muted)}
.i-skip .i-val{color:var(--muted); font-weight:400}
.contact-note,.need-more{margin-top:10px; padding:10px 12px; border-radius:var(--r); font-size:.82rem; line-height:1.55}
.contact-note{background:var(--alert-wash); color:var(--ink-2)}
.contact-note strong{color:var(--alert)}
.need-more{background:var(--sunk); color:var(--ink-2)}

/* פרטי צד וקופות */
.people{display:grid; gap:16px}
.person > details{display:block}
.person-head{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.person-head h3{font-size:1rem}
.person-head .edit-cue{margin-inline-start:auto; font-size:.78rem; color:var(--accent)}
.funds{margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:8px}
.funds-head span{font-size:.86rem; font-weight:600}
.fund-meta{font-size:.74rem; color:var(--muted)}
.fund-meta.warn{color:var(--alert)}
.fund{display:flex; flex-direction:column; gap:8px; padding:12px; border:1px solid var(--line-soft); border-radius:var(--r)}
.fund-row{display:grid; grid-template-columns:1fr 130px 34px; gap:8px; align-items:end}
.fund-row.two{grid-template-columns:1fr 1fr}
.fld{display:flex; flex-direction:column; gap:3px; min-width:0}
.fld > span{font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon-btn{background:none; border:1px solid var(--line); color:var(--faint); cursor:pointer; width:34px; height:40px; border-radius:var(--r); font-size:1rem}
.icon-btn:hover{color:var(--alert); border-color:var(--alert)}
.add-fund{background:none; border:1px dashed var(--line); color:var(--muted); cursor:pointer; font:inherit; font-size:.84rem; padding:8px; border-radius:var(--r)}
.add-fund:hover{border-color:var(--accent); color:var(--accent)}
.liq{display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--ink-2); cursor:pointer}
.liq input{width:16px; height:16px; min-height:0; margin:0; accent-color:var(--accent)}
.no-rights{font-size:.84rem; color:var(--muted); margin-top:14px}

/* תוצאות */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.tile{border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 16px; display:flex; flex-direction:column; gap:2px}
.tile.headline{border-color:var(--accent); background:var(--accent-wash)}
.tile .t-label{font-size:.8rem; font-weight:500}
.tile .t-name{font-size:.72rem; color:var(--muted)}
.tile .t-value{font-size:1.45rem; font-weight:600; font-variant-numeric:tabular-nums; margin-top:6px}
.tile.headline .t-value{color:var(--accent)}
.tile .t-sub{font-size:.76rem; color:var(--muted)}
.breakdown{margin-top:16px; border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.bd-head{padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.bd-head h3{font-size:.95rem}
.table-scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:.86rem}
th,td{padding:9px 16px; text-align:right; border-bottom:1px solid var(--line-soft); white-space:nowrap}
th{font-size:.76rem; font-weight:500; color:var(--muted); background:var(--surface-2)}
td:first-child{white-space:normal; min-width:200px}
tbody tr:last-child td{border-bottom:0}
td.v{font-variant-numeric:tabular-nums}
tr.total td{font-weight:600; background:var(--surface-2)}
.step-note{display:block; font-size:.74rem; color:var(--faint); font-weight:400; white-space:normal}
.warn-note{font-size:.78rem; color:var(--muted); padding:10px 16px; border-top:1px solid var(--line)}
.results{margin-top:8px}

/* חוות הדעת לפני הפקה */
.locked{position:relative; margin-top:16px}
.locked .veil{position:absolute; inset:0; z-index:3; display:grid; place-items:center; padding:20px; background:linear-gradient(to bottom,rgba(255,255,255,.6),#fff 40%)}
.locked[data-unlocked="true"] .veil{display:none}
.locked-body{filter:blur(4px); user-select:none; pointer-events:none}
.locked[data-unlocked="true"] .locked-body{filter:none; user-select:auto; pointer-events:auto}
.locked:not([data-unlocked="true"]) .locked-body{max-height:480px; overflow:hidden}
.gate{background:#fff; border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; max-width:380px; text-align:center; box-shadow:var(--shadow-lift)}
.gate h3{font-size:1.05rem}
.gate p{color:var(--muted); font-size:.86rem; margin-top:6px}
.gate-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px}
.gate .lock-mark,.gate .gate-list{display:none}

/* ניווט שלבים */
.wizard-nav{position:sticky; bottom:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:12px 0; margin-top:24px}
.wizard-nav-status{flex:1; text-align:center; font-size:.8rem; color:var(--muted)}
.wizard-nav-status.error{color:var(--alert); font-weight:500}
.wizard-hidden{display:none!important}

/* חלון */
.modal{position:fixed; inset:0; z-index:80; display:none; place-items:center; padding:24px; background:rgba(0,0,0,.4)}
.modal[open]{display:grid}
.modal-card{background:#fff; border-radius:var(--r-lg); padding:24px; max-width:420px}
.modal-card h3{font-size:1.05rem}
.modal-card p{font-size:.86rem; color:var(--muted); margin-top:8px}

@media(max-width:640px){
  .fields,.shared{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .wizard-progress li{font-size:.68rem}
  .wizard-mode,.wizard-case,.person{padding:16px}
  .fund-row{grid-template-columns:1fr 104px 34px}
  .fund-row.two{grid-template-columns:1fr}
  .i-row{flex-direction:column; gap:4px}
  .i-row .i-val{max-width:none; text-align:right}
  .i-row .i-val .i-sub{text-align:right}
  .seg{width:100%}.seg button{flex:1; padding:8px 6px}
}

/* מה מוצג בכל שלב */
body[data-wizard-step="0"] #intake,body[data-wizard-step="0"] #intakeMsg,body[data-wizard-step="0"] #people,body[data-wizard-step="0"] .wizard-case,body[data-wizard-step="0"] #results,
body[data-wizard-step="1"] .wizard-mode,body[data-wizard-step="1"] .wizard-case,body[data-wizard-step="1"] #results,
body[data-wizard-step="2"] .wizard-mode,body[data-wizard-step="2"] .wizard-case,body[data-wizard-step="2"] #results,
body[data-wizard-step="3"] .wizard-mode,body[data-wizard-step="3"] #intake,body[data-wizard-step="3"] #intakeMsg,body[data-wizard-step="3"] #people,body[data-wizard-step="3"] #results,
body[data-wizard-step="4"] .wizard-mode,body[data-wizard-step="4"] #intake,body[data-wizard-step="4"] #intakeMsg,body[data-wizard-step="4"] #people,body[data-wizard-step="4"] .wizard-case{display:none!important}
body[data-wizard-step="1"] #intake>[data-drop="1"],body[data-wizard-step="1"] #people>.person:nth-child(2),
body[data-wizard-step="2"] #intake>[data-drop="0"],body[data-wizard-step="2"] #people>.person:nth-child(1){display:none!important}
body:not([data-wizard-step="0"]) .privacy-note{display:none}

<script>
"use strict";
const DAY = 86400000;
const $ = (s, r) => (r || document).querySelector(s);

/* All dates are handled at UTC midnight. Parsing them as local time makes a
   day-count straddling a daylight-saving change come out an hour short, which
   shifts the accrual years and the transfer share in the 4th decimal. */
const normYmd = v => { const m = String(v||"").match(/^(\d{1,4})-(\d{2})-(\d{2})$/); if (!m) return v; let y = parseInt(m[1],10); if (y < 100) y += 2000; return String(y).padStart(4,"0")+"-"+m[2]+"-"+m[3]; };
const parseDate = v => { if (!v) return null; const d = new Date(normYmd(v) + "T00:00:00Z"); if (isNaN(d)) return null; const y = d.getUTCFullYear(); return (y < 1950 || y > 2100) ? null : d; };
const fmtD = d => d ? String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear() : "";
const utcDate = (y, m, d) => new Date(Date.UTC(y, m, d));

/* ---------------- model ---------------- */
/* הנחות התחשיב. ברירות המחדל הן אלה של חוות הדעת החתומות (פרישה 67/65,
   תוחלת חיים 81.7/85.7 לפי הלמ"ס), וניתנות לשינוי בהגדרות התחשיב. */
const ASSUME_DEFAULTS = { retM: 67, retF: 65, lifeM: 81.7, lifeF: 85.7 };
const ASSUME_LIMITS = { ret: [50, 75], life: [60, 100] };
function assumption(id){
  const el = typeof document !== "undefined" ? document.getElementById(id) : null;
  const v = el ? parseFloat(el.value) : NaN;
  const [lo, hi] = ASSUME_LIMITS[id.slice(0, -1)];
  return isFinite(v) && v >= lo && v <= hi ? v : ASSUME_DEFAULTS[id];
}
const retireAge = g => assumption(g === "male" ? "retM" : "retF");
const lifeAge   = g => assumption(g === "male" ? "lifeM" : "lifeF");

/* גיל עשרוני → שנים, חודשים וימים. 0.7 שנה = 8 חודשים ו־12 ימים,
   כמו בחוות הדעת החתומות. */
function addAge(birth, age){
  const whole = Math.floor(age + 1e-9);
  const monthsF = (age - whole) * 12;
  const months = Math.floor(monthsF + 1e-9);
  const days = Math.round((monthsF - months) * 30.4375);
  return utcDate(birth.getUTCFullYear() + whole, birth.getUTCMonth() + months, birth.getUTCDate() + days);
}
function retireDate(birth, g){ return addAge(birth, retireAge(g)); }
function mortalityDate(birth, g){ return addAge(birth, lifeAge(g)); }
function monthsBetween(from, to){
  return Math.max(0, Math.round((to - from) / DAY / 30.4375));
}
function yearsBetween(brk, ret){
  /* 365-day year, matching the signed opinions. */
  return ret > brk ? (ret - brk) / DAY / 365 : 0;
}
/* value at the start of the payment stream */
function annuity(P, i, n){
  if (n <= 0 || P <= 0) return 0;
  if (i === 0) return P * n;
  return P * (1 - Math.pow(1 + i, -n / 12)) / (1 - Math.pow(1 + i, -1 / 12));
}
function discountBack(v, i, years){ return v / Math.pow(1 + i, years); }

/* Transfer share, per fund:
   (shared years ÷ the fund's own accrual years) ÷ 2, capped at 50%.
   Years use a 365-day divisor, matching the expert opinions these figures come from.
   A fund opened after the wedding is wholly marital, so the ratio caps out at 1.
   A fund opened on or after the break accrued nothing in the partnership: 0%. */
function transferShare(marriage, breakDate, opened){
  if (!marriage || isNaN(marriage) || !breakDate || isNaN(breakDate)) return { share: 0.5, accrual: null, raw: null };
  if (!opened || isNaN(opened))                                        return { share: 0.5, accrual: null, raw: null };
  const shared  = (breakDate - marriage) / DAY / 365;
  const accrual = (breakDate - opened)   / DAY / 365;
  if (accrual <= 0) return { share: 0, accrual: 0, raw: 0, shared, joint: 0, afterBreak: true };
  if (shared <= 0)  return { share: 0, accrual, raw: 0, shared: 0, joint: 0 };
  const raw = shared / accrual;
  return { share: Math.min(1, raw) / 2, accrual, raw, shared, joint: Math.min(shared, accrual) };
}

/* קופת גמל (גם לא פעילה, גם מרכזית לפיצויים) היא חיסכון פנסיוני לפי החוק
   ומקבלת פסיקתא. גמל להשקעה וקרן השתלמות — לא; הן מאוזנות במזומן. */
function capitalHasPsikta(c){
  const k = `${c.name || ""} ${c.kind || ""}`;
  return !c.atRetire && /גמל/.test(k) && !/להשקעה|השתלמות/.test(k);
}

function computePerson(p, rate, breakDate, otherMortality, taxRate, marriage){
  const birth = parseDate(p.birth);
  const out = { valid: false, funds: [] };
  if (!birth || isNaN(birth) || !breakDate || isNaN(breakDate)) return out;
  const ret   = retireDate(birth, p.gender);
  const death = mortalityDate(birth, p.gender);
  /* מי שכבר פרש לפני מועד הקרע — נספרים רק התשלומים שממועד הקרע ואילך;
     תשלומים שכבר שולמו אינם חלק מהשווי שנותר לחלוקה. */
  const start = ret > breakDate ? ret : breakDate;
  const n     = monthsBetween(start, death);
  const yrs   = yearsBetween(breakDate, ret);
  const nEarly = otherMortality
    ? monthsBetween(start, new Date(Math.min(death.getTime(), otherMortality.getTime())))
    : n;

  let monthly = 0, atRetire = 0, atBreak = 0, atBreakEarly = 0;
  let transfer = 0, transferEarly = 0;
  p.funds.forEach(f => {
    const P = Number(f.amount) || 0;
    const opened = parseDate(f.opened);
    const sh = transferShare(marriage, breakDate, opened);
    if (P <= 0) {
      out.funds.push({ name: f.name, acct: f.acct, body: f.body, nikuim: f.nikuim, amount: 0,
                       atBreak: 0, atBreakEarly: 0, transfer: 0, transferEarly: 0, sh, opened });
      return;
    }
    const ar = annuity(P, rate, n);
    const ab = discountBack(ar, rate, yrs);
    const ae = discountBack(annuity(P, rate, nEarly), rate, yrs);
    monthly += P; atRetire += ar; atBreak += ab; atBreakEarly += ae;
    transfer += ab * sh.share; transferEarly += ae * sh.share;
    out.funds.push({ name: f.name, acct: f.acct, body: f.body, nikuim: f.nikuim, amount: P,
                     atBreak: ab, atBreakEarly: ae,
                     transfer: ab * sh.share, transferEarly: ae * sh.share, sh, opened });
  });

  /* גישה ב is built from the balances actually accrued by the break date —
     pension and active provident funds only. Study funds and investment-
     provident accounts are capital: half each, no tax, and no פסיקתה. */
  const balances = (p.balances || []).reduce((t, b) => t + (Number(b.amount) || 0), 0);
  /* A capital asset carries 25% tax only when it is explicitly a study fund
     (קרן השתלמות) or an investment provident fund (קופת גמל להשקעה) — and a
     study fund whose redemption date has arrived goes in untaxed. Any other
     capital asset is not marked with tax at all. */
  const CG_RATE = 0.25;
  const isTaxableCapital = b => b.taxable === true || /השתלמות|להשקעה/.test(String(b.name || "") + " " + String(b.kind || ""));
  /* המס חל על הרווח. כשהרווח החייב ידוע (הוזן) — 25% ממנו; כשאינו ידוע,
     כמו בחוות הדעת החתומות — 25% מהיתרה כולה, וכך גם נכתב בדוח. */
  const gainOf = b => { const g = parseFloat(b.gain); return isFinite(g) && g >= 0 ? g : null; };
  const taxOf = (b, value) => {
    if (b.liquid || b.atRetire || !isTaxableCapital(b)) return 0;
    const g = gainOf(b);
    return CG_RATE * (g == null ? value : Math.min(g, value));
  };
  /* An inactive pension paying a one-off sum at retirement is a capital asset
     too, discounted as a sum (not an annuity) from retirement back to the break:
     amount ÷ (1+i)^years. It is shown before tax, like the signed opinions. */
  const capVal = b => { const a = Number(b.amount) || 0; return b.atRetire ? discountBack(a, rate, yrs) : a; };
  /* The partnership ratio always comes from the dates — the same formula as
     the pension funds (shared years ÷ the asset's own accrual years). */
  const capItems = (p.capital || []).map(b => {
    const value = capVal(b);
    const tax = taxOf(b, value);
    const sh = transferShare(marriage, breakDate, parseDate(b.opened));
    /* נכס שהצדדים הסכימו שלא לאזן — מוצג בדוח, אך אינו נכנס לחישוב */
    const k = b.exclude ? 0 : 1;
    return Object.assign({}, b, { value, tax, sh, taxable: tax > 0, taxOnGain: tax > 0 && gainOf(b) != null, excluded: !!b.exclude,
      psikta: capitalHasPsikta(b),
      marital: (value - tax) * sh.share * 2 * k, due: (value - tax) * sh.share * k });
  });
  const counted = capItems.filter(b => !b.excluded);
  const capital = counted.reduce((t, b) => t + b.value, 0);
  const capGainsTax = counted.reduce((t, b) => t + b.tax, 0);
  return Object.assign(out, {
    valid: true, retire: ret, death, months: n, monthsEarly: nEarly, years: yrs,
    retiredAtBreak: ret <= breakDate,
    monthly, atRetire, atBreak, atBreakEarly, transfer, transferEarly,
    balances, capital, capGainsTax, capItems,
    capitalNet: capital - capGainsTax,
    capitalShare: counted.reduce((t, b) => t + b.due, 0),
    balancesShare: balances * (1 - taxRate) * 0.5,
    /* The three approaches, each a complete way of valuing the same rights:
       1 — the balance taken now, less tax, split in half
       2 — discounted, payments stopping at the earlier of the two life expectancies
       3 — discounted, each party counted to their own life expectancy           */
    v1: balances * (1 - taxRate),  share1: balances * (1 - taxRate) * 0.5,
    v2: atBreakEarly,              share2: transferEarly,
    v3: atBreak,                   share3: transfer,
    balancesNet: balances * (1 - taxRate),
    tax: balances * taxRate
  });
}

/* פרטי הקשר שמוצגים כשיש מוצר שהמחשבון אינו מטפל בו. */
const CONTACT = { name: "יפתח ונגר", phone: "", email: "" };

/* טבלאות הקודים של המבנה האחיד. */
const SUG_MUTZAR = {
  "1": "פוליסת ביטוח / ביטוח מנהלים",
  "2": "קרן פנסיה",
  "3": "קופת גמל",
  "4": "קרן השתלמות",
  "5": "קופת גמל מרכזית לפיצויים",
  "6": "ביטוח חיים",
  "7": "קופת ביטוח"
};
/* SUG-KEREN-PENSIA: 1 ותיקה · 2 חדשה מקיפה · 3 חדשה כללית (משלימה) */
const KEREN_PENSIA = { "1": "ותיקה", "2": "מקיפה", "3": "משלימה" };
const SUPPORTED_KEREN = new Set(["2", "3"]);
/* נכסים הוניים: ביטוח מנהלים, קופות גמל, קרנות השתלמות וגמל
   להשקעה. כולם נכנסים לתחשיב ההוני — חלוקה שווה. מס 25% מסומן רק
   על נכס שכתוב בו במפורש „קרן השתלמות” או „קופת גמל להשקעה”, וגם
   קרן השתלמות שכבר ניתן לפדות נכנסת ללא מס.
   מה שנשאר בחוץ: פנסיה ותיקה (דורשת חישוב אקטוארי נפרד) וכיסויי
   ריסק טהור, שאין בהם חיסכון כלל. */
const CAPITAL_MUTZAR = {
  "1": "ביטוח מנהלים",
  "3": "קופת גמל",
  "4": "קרן השתלמות",
  "5": "קופת גמל מרכזית לפיצויים",
  "7": "קופת ביטוח"
};
const ONLY_PENSION = "המחשבון מהוון קרן פנסיה מקיפה או משלימה בלבד";

const mTxt = (node, tag) => {
  if (!node) return "";
  const el = node.getElementsByTagName(tag)[0];
  return el && el.textContent ? el.textContent.trim() : "";
};
/* ילד ישיר בלבד — אותה תגית חוזרת בעומקים שונים בקובץ */
const mKids = (node, tag) => {
  const out = [];
  if (node) for (const c of node.children) if (c.tagName === tag) out.push(c);
  return out;
};
const mNum = v => { const n = parseFloat(String(v || "").replace(/,/g, "")); return isFinite(n) ? n : 0; };
const mYmd = v => {                       /* 20011129 → 2001-11-29 */
  const s = String(v || "").trim();
  return /^\d{8}$/.test(s) ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : "";
};
const mUnpad = v => String(v || "").replace(/^0+/, "");

/* פירוט הפקדות בקובצי XML משתנה מעט בין גרסאות הממשק. קוראים רק
   רשומה שיש בה גם תאריך ערך וגם שדות סכום מזוהים; אם אין כזו,
   ההתאמה נעצרת ולא מנסה להעריך הפקדות. */
function xmlDeposits(hesh){
  const rows = [];
  const candidates = [...hesh.getElementsByTagName("*")].filter(node => {
    const tags = [...node.children].map(c => c.tagName.toUpperCase());
    return tags.some(t => /TAARICH.*(ERECH|HAFKAD)/.test(t)) && tags.some(t => /(SCHUM|SUM).*(HAFKAD|TAGMUL|PITZU|OVED|MAASIK)/.test(t));
  });
  for (const node of candidates){
    const dateChild = [...node.children].find(c => /TAARICH.*(ERECH|HAFKAD)/.test(c.tagName.toUpperCase()));
    const valueDate = mYmd(dateChild && dateChild.textContent);
    if (!valueDate) continue;
    let amount = 0;
    for (const c of node.children){
      const tag = c.tagName.toUpperCase();
      if (/(SCHUM|SUM).*(HAFKAD|TAGMUL|PITZU|OVED|MAASIK)/.test(tag) && !/(SACHAR|MASKORET|ACHSHAR)/.test(tag)) amount += mNum(c.textContent);
    }
    const salary = [...node.children].find(c => /(CHODESH|HODESH).*(SACHAR|MASKORET)/.test(c.tagName.toUpperCase()));
    if (amount > 0) rows.push({ valueDate, salaryMonth: String(salary && salary.textContent || ""), amount: Math.round(amount * 100) / 100, source: "XML" });
  }
  const seen = new Set();
  return rows.filter(r => { const k = `${r.valueDate}|${r.salaryMonth}|${r.amount}`; if (seen.has(k)) return false; seen.add(k); return true; });
}

/* שתי תוכניות יכולות לשבת על אותו מספר פוליסה, ובדוח ה־PDF שום שדה
   לא מבדיל ביניהן — רק הסכום. נותנים לכל רשומה מספר סידורי, כדי
   שאיחוד בין קבצים לא יבלע אחת מהן.
   הזהות לאיחוד היא הסל, לא התווית: ה־XML קורא לאותה פוליסה
   "קופת גמל מרכזית לפיצויים" וה־PDF "ביטוח מנהלים", ולפי תווית
   היא הייתה נספרת פעמיים. בקרן פנסיה כן מבדילים מקיפה ממשלימה,
   כי שתיהן יושבות על אותו מספר חשבון. */
function seqTag(list, bucket){
  const seen = new Map();
  for (const it of list){
    it.dk = bucket === "fund" ? `fund:${it.kind}` : bucket;
    const k = `${it.acct}|${it.dk}`;
    const n = seen.get(k) || 0;
    it.seq = n;
    seen.set(k, n + 1);
  }
  return list;
}

function readMaslakaXml(xmlText, fileName){
  const out = { file: fileName, person: null, funds: [], capital: [], skipped: [], error: "" };
  let doc;
  try { doc = new DOMParser().parseFromString(xmlText, "application/xml"); }
  catch (e) { out.error = "הקובץ אינו XML תקין"; return out; }
  if (doc.getElementsByTagName("parsererror").length){ out.error = "הקובץ אינו XML תקין"; return out; }

  const root = doc.documentElement;
  if (!root || root.tagName !== "Mimshak"){ out.error = "זה לא קובץ מסלקה במבנה אחיד"; return out; }

  for (const yatzran of root.getElementsByTagName("YeshutYatzran")){
    const bodyName = mTxt(yatzran, "SHEM-YATZRAN") || mTxt(yatzran, "KOD-MEZAHE-YATZRAN");

    for (const mutzar of yatzran.getElementsByTagName("Mutzar")){
      const netunei   = mutzar.getElementsByTagName("NetuneiMutzar")[0];
      const sugMutzar = mTxt(netunei, "SUG-MUTZAR");

      /* פרטי החוסך זהים בכל הקובץ — די לקרוא אותם פעם אחת */
      if (!out.person && netunei){
        const l = netunei.getElementsByTagName("YeshutLakoach")[0];
        if (l){
          const min = mTxt(l, "MIN");
          out.person = {
            /* שם משפחה ואחריו שם פרטי — כמו בחוות הדעת החתומות */
            name:   [mTxt(l, "SHEM-MISHPACHA"), mTxt(l, "SHEM-PRATI")].filter(Boolean).join(" "),
            id:     mUnpad(mTxt(l, "MISPAR-ZIHUY-LAKOACH")),
            birth:  mYmd(mTxt(l, "TAARICH-LEYDA")),
            gender: min === "2" ? "female" : min === "1" ? "male" : ""
          };
        }
      }

      for (const hesh of mutzar.getElementsByTagName("HeshbonOPolisa")){
        const plan  = mTxt(hesh, "SHEM-TOCHNIT");
        const acct  = mUnpad(mTxt(hesh, "MISPAR-POLISA-O-HESHBON"));
        const keren = mTxt(hesh, "SUG-KEREN-PENSIA");
        const label = plan || SUG_MUTZAR[sugMutzar] || "מוצר";

        /* צבירה: כל שכבות היתרה בכל בלוקי המעסיקים — פיצויים,
           תגמולי עובד ותגמולי מעביד. נקרא לכל סוג מוצר, כדי שגם
           מה שלא נכנס להיוון יוצג עם הסכום שלו. */
        let balance = 0, asOf = "";
        for (const block of hesh.getElementsByTagName("BlockItrot")){
          for (const yit of mKids(block, "Yitrot")){
            asOf = asOf || mYmd(mTxt(yit, "TAARICH-ERECH-TZVIROT"));
            for (const row of mKids(yit, "PerutYitrot")) balance += mNum(mTxt(row, "TOTAL-CHISACHON-MTZBR"));
          }
        }
        balance = Math.round(balance * 100) / 100;

        /* הקצבה החודשית הצפויה בגיל פרישה — KITZVAT-HODSHIT-TZFUYA
           הוא זה שללא המשך הפקדות. SCHUM-KITZVAT-ZIKNA כולל המשך
           הפקדות, ואותו לא לוקחים. */
        let kitzba = 0, gilPrisha = 0;
        for (const y of hesh.getElementsByTagName("YitraLefiGilPrisha")){
          gilPrisha = gilPrisha || mNum(mTxt(y, "GIL-PRISHA"));
          for (const kupa of y.getElementsByTagName("Kupa"))
            if (mTxt(kupa, "SUG-KUPA") === "1") kitzba += mNum(mTxt(kupa, "KITZVAT-HODSHIT-TZFUYA"));
        }

        const opened = mYmd(mTxt(hesh, "TAARICH-HITZTARFUT-MUTZAR")) || mYmd(mTxt(hesh, "TAARICH-HITZTARFUT-RISHON"));
        const common = {
          body: bodyName, plan: label, acct, opened, balance,
          firstJoined: mYmd(mTxt(hesh, "TAARICH-HITZTARFUT-RISHON")),
          asOf: asOf || mYmd(mTxt(hesh, "TAARICH-NECHONUT")),
          active: mTxt(hesh, "STATUS-POLISA-O-CHESHBON") === "1",
          deposits: xmlDeposits(hesh)
        };

        /* ---- לאיזה סל הולך המוצר ---- */
        if (sugMutzar === "2" && SUPPORTED_KEREN.has(keren)){
          out.funds.push(Object.assign({}, common, {
            kind: `קרן פנסיה ${KEREN_PENSIA[keren] || ""}`.trim(),
            kitzba: Math.round(kitzba * 100) / 100, gilPrisha
          }));
        } else if (CAPITAL_MUTZAR[sugMutzar]){
          out.capital.push(Object.assign({}, common, {
            kind: CAPITAL_MUTZAR[sugMutzar],
            hishtalmut: sugMutzar === "4"
          }));
        } else {
          out.skipped.push(Object.assign({}, common, {
            kind: sugMutzar === "2"
              ? (keren === "1" ? "קרן פנסיה ותיקה" : "קרן פנסיה — סוג לא מזוהה")
              : (SUG_MUTZAR[sugMutzar] || "מוצר לא מזוהה"),
            why: ONLY_PENSION
          }));
        }
      }
    }
  }
  seqTag(out.funds, "fund"); seqTag(out.capital, "capital"); seqTag(out.skipped, "skip");
  if (!out.funds.length && !out.capital.length && !out.skipped.length && !out.error) out.error = "לא נמצאו חשבונות בקובץ";
  return out;
}

/* ============================================================
   קריאת דוח מסלקה בפורמט PDF — "דוח ריכוז מוצרים פנסיונים"
   ------------------------------------------------------------
   ה־PDF בנוי כטבלה: עמודת תוויות מימין, ועמודת ערכים לכל קופה.
   קוראים אותו לפי מיקום הטקסט על העמוד, לא לפי סדר הקריאה —
   כי בטקסט הרציף ערכים של שתי קופות נדבקים זה לזה.
   בסוף מוודאים מול סכום הביקורת שבעמוד הראשון. אם אין התאמה,
   הקריאה נפסלת ולא מוחזר מספר.
   ============================================================ */

const DETAIL_HEADER   = "פירוט המוצרים על פי סוג המוצר";
const PENSION_SECTION = "קרנות פנסיה חדשות";
/* תוויות שמופיעות תמיד כפריט טקסט יחיד — מהן נגזר גבול העמודות. */
const PDF_ANCHORS = [
  "שם חברה מנהלת", "סוג מוצר פנסיוני", "מספר פוליסה", "סטטוס",
  "תאריך פתיחת תכנית", "תאריך נכונות נתונים", "ח.פ חברה מנהלת",
  "מספר תיק ניכויים", "תשואה מתחילת השנה", "פנסיית נכות"
];

const norm = s => String(s || "").replace(/[‎‏]/g, "").replace(/\s+/g, " ").trim();
/* "1,810,519.06" → 1810519.06 */
const pdfNum = s => {
  const m = norm(s).replace(/[^\d.,-]/g, "").replace(/,/g, "");
  const n = parseFloat(m);
  return isFinite(n) ? n : null;
};
/* "29/11/2001" → 2001-11-29 */
const pdfDate = s => {
  const m = norm(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : "";
};

/* קיבוץ פריטי טקסט לשורות. מרווח בין שורות ~22, בתוך שורה ≤5. */
function pdfRows(items){
  const rows = [];
  let cur = null;
  for (const it of items.slice().sort((a, b) => b.y - a.y)){
    if (!cur || (cur.lastY - it.y) > 10){ cur = { y: it.y, lastY: it.y, items: [it] }; rows.push(cur); }
    else { cur.items.push(it); cur.lastY = it.y; }
  }
  for (const r of rows) r.text = norm(r.items.slice().sort((a, b) => (b.y - a.y) || (b.x - a.x)).map(i => i.str).join(" "));
  return rows;
}

/* גבול בין עמודת התוויות לעמודות הערכים, נגזר מהמסמך עצמו. */
function pdfLabelEdge(rows){
  let maxValueX = 0;
  for (const r of rows){
    const single = r.items.filter(i => PDF_ANCHORS.indexOf(norm(i.str)) !== -1);
    if (single.length !== 1) continue;
    for (const it of r.items) if (it !== single[0]) maxValueX = Math.max(maxValueX, it.x);
  }
  return maxValueX ? maxValueX + 10 : 0;
}

/* התווית של שורה, והערכים שלה מסודרים מימין לשמאל. */
function pdfSplit(row, edge){
  const lab = [], val = [];
  for (const it of row.items) (it.x >= edge ? lab : val).push(it);
  const label = norm(lab.sort((a, b) => (b.y - a.y) || (b.x - a.x)).map(i => i.str).join(" "));
  const cells = val.filter(i => !/^[₪*\s]*$|^או$/.test(norm(i.str))).sort((a, b) => b.x - a.x);
  return { label, cells };
}

/* מרכז אופקי של תא. שמות ארוכים ממורכזים בעמודה, ולכן קצה התא
   רחוק מהעוגן גם כשהתא שייך לו. */
const pdfCx = c => c.x + (c.w || 0) / 2;

/* שיוך ערך לעמודה לפי קרבת המרכזים, כדי ששורה עם תא ריק לא תזיז הכול.
   ערך שכתוב על כמה שורות (למשל "פנסיה חדשה" ומתחת "מקיפה") מחובר
   לטקסט אחד, מלמעלה למטה. */
function pdfByColumn(cells, anchors){
  let gap = Infinity;
  for (let k = 1; k < anchors.length; k++) gap = Math.min(gap, Math.abs(anchors[k - 1] - anchors[k]));
  const guard = anchors.length < 2 ? 140 : Math.max(20, Math.min(140, gap / 2));
  const parts = anchors.map(() => []);
  for (const c of cells){
    let best = -1, dist = guard;
    anchors.forEach((ax, k) => { const d = Math.abs(pdfCx(c) - ax); if (d < dist){ dist = d; best = k; } });
    if (best !== -1) parts[best].push(c);
  }
  return parts.map(p => p.length
    ? norm(p.sort((a, b) => (b.y - a.y) || (b.x - a.x)).map(c => c.str).join(" "))
    : null);
}

/* ---- דוח סרוק: נשלח לקריאה ממוחשבת דרך האתר המארח, ואינו נשמר ----
   המודל רק מעתיק ערכים. הסיווג, השיוך והביקורת מול סכום הדוח נעשים כאן,
   באותם כללים כמו בקריאת PDF רגיל, ואי־התאמה פוסלת את הקריאה. */
function askHostToRead(buffer, fileName){
  return new Promise(resolve => {
    if (window.parent === window){ resolve({ ok: false, error: "קריאת קובץ סרוק זמינה רק באתר" }); return; }
    const bytes = new Uint8Array(buffer); let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const reqId = "r" + Math.random().toString(36).slice(2);
    const onMsg = e => {
      if (!e.data || e.data.type !== "nk-ocr-result" || e.data.reqId !== reqId) return;
      window.removeEventListener("message", onMsg); resolve(e.data);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "nk-ocr-request", reqId, pdf: btoa(bin), name: fileName }, "*");
  });
}

async function readScannedPdf(buffer, fileName, fallback){
  const out = { file: fileName, person: null, funds: [], capital: [], skipped: [], error: "" };
  const res = await askHostToRead(buffer, fileName);
  if (!res.ok){ out.error = res.error || "קריאת הקובץ הסרוק נכשלה"; return out; }
  const r = res.result || {};
  if (!r.isMaslakaReport){ out.error = "זה לא דוח ריכוז מוצרים של המסלקה"; return out; }
  out.scanned = true;
  out.person = { name: [r.lastName, r.firstName].filter(Boolean).join(" "), id: String(r.id || "").replace(/\D/g, ""), birth: "", gender: "" };
  const num = v => (typeof v === "number" && isFinite(v)) ? v : null;
  for (const p of (r.products || [])){
    const section = norm(p.section), kind = norm(p.productType), body_ = norm(p.company) || section;
    const isPension = section.indexOf(PENSION_SECTION) === 0;
    const risk = /ריסק|משכנתא|ביטוח חיים/.test(section);
    const capKind = risk ? ""
                  : /השתלמות/.test(section) ? "קרן השתלמות"
                  : /גמל להשקעה/.test(section) ? "גמל להשקעה"
                  : /קופות גמל|קופת גמל/.test(section) ? "קופת גמל"
                  : /ביטוח מנהלים|חיסכון טהור|חברות ביטוח/.test(section) ? "ביטוח מנהלים" : "";
    const common = {
      body: body_, plan: kind || section, acct: String(p.policy || "").replace(/\D/g, "").replace(/^0+/, ""),
      opened: pdfDate(p.opened), balance: num(p.balance) || 0, asOf: pdfDate(p.asOf),
      firstJoined: pdfDate(p.firstJoined), withdrawable: norm(p.withdrawable),
      active: /^פעיל/.test(norm(p.status)), nikuim: String(p.nikuim || "").replace(/\D/g, "")
    };
    if (isPension && /מקיפה|כללית|משלימה/.test(kind) && !/ותיק/.test(kind)){
      const mashlima = /כללית|משלימה/.test(kind);
      out.funds.push(Object.assign({}, common, {
        plan: [body_, mashlima ? "משלימה" : "מקיפה"].filter(Boolean).join(" "),
        kind: mashlima ? "קרן פנסיה משלימה" : "קרן פנסיה מקיפה",
        kitzba: num(p.kitzba) || 0, gilPrisha: 0
      }));
    } else if (capKind){
      out.capital.push(Object.assign({}, common, { plan: [body_, capKind].filter(Boolean).join(" — "), kind: capKind, hishtalmut: capKind === "קרן השתלמות" }));
    } else {
      out.skipped.push(Object.assign({}, common, { kind: /ותיק/.test(kind) ? "קרן פנסיה ותיקה" : section, why: ONLY_PENSION }));
    }
  }
  /* הפקדות — רק לחשבון שמספרו תואם בדיוק */
  for (const d of (r.deposits || [])){
    const acct = String(d.policy || "").replace(/\D/g, "").replace(/^0+/, "");
    const amount = num(d.amount);
    const target = acct && pickDepositTarget([...out.funds, ...out.capital].filter(f => f.acct === acct), `${acct} ${norm(d.company)}`);
    if (!target || !(amount > 0)) continue;
    (target.deposits || (target.deposits = [])).push({
      valueDate: pdfDate(d.valueDate), salaryMonth: norm(d.salaryMonth), amount: Math.round(amount * 100) / 100, source: "PDF סרוק"
    });
  }
  /* ביקורת מול סכומי העמוד הראשון (מעוגלים לשקל) */
  const totals = r.statedTotals || [];
  const stated = totals.find(t => norm(t.category).indexOf(PENSION_SECTION) === 0);
  if (out.funds.length){
    const sum = out.funds.reduce((t, f) => t + f.balance, 0);
    if (!stated || Math.abs(sum - stated.amount) > 2){
      out.error = stated
        ? `הקריאה הממוחשבת לא הסתדרה: נקראו ${ils.format(sum)} מול ${ils.format(stated.amount)} שמופיעים בדוח. ${CONTACT_YIFTACH}`
        : "לא ניתן היה לאמת את הקריאה מול סכום הדוח. " + CONTACT_YIFTACH;
      out.funds = []; out.capital = []; out.skipped = [];
      return out;
    }
  }
  const statedAll = totals.reduce((t, x) => t + (num(x.amount) || 0), 0);
  const all = [...out.funds, ...out.capital, ...out.skipped].reduce((t, f) => t + (f.balance || 0), 0);
  out.notes = [fallback
    ? "הדוח נקרא בקריאה ממוחשבת ונבדק מול סכומי העמוד הראשון — מומלץ לעבור על הסכומים מול הדוח."
    : "הדוח נקרא מקובץ סרוק בקריאה ממוחשבת — מומלץ לעבור על הסכומים מול הדוח."];
  if (totals.length && Math.abs(all - statedAll) > 2 + totals.length)
    out.notes.push(`סך הצבירות שנקראו הוא ${ils.format(all)}, ובדוח מופיע ${ils.format(statedAll)}. כדאי לבדוק ידנית.`);
  seqTag(out.funds, "fund"); seqTag(out.capital, "capital"); seqTag(out.skipped, "skip");
  if (!out.funds.length && !out.capital.length && !out.skipped.length) out.error = "לא נמצאו חשבונות בקובץ";
  return out;
}

/* שיוך כותרת של טבלת הפקדות לקופה: לפי מספר הפוליסה, ואם כמה קופות
   חולקות אותו מספר — לפי שם החברה המנהלת שבכותרת, ואז לפי סוג המוצר,
   ואז רק קופה פעילה (ההפקדות מפורטות לחשבונות הפעילים). שיוך שנשאר דו־משמעי
   לא נעשה — עדיף לחסום מלנחש. */
function pickDepositTarget(all, header){
  const h = norm(header).replace(/["״׳']/g, "");
  const bare = v => norm(v).replace(/["״׳']/g, "");
  let c = all.filter(f => f.acct && h.indexOf(f.acct) !== -1);
  if (c.length > 1){ const byBody = c.filter(f => f.body && h.indexOf(bare(f.body)) !== -1); if (byBody.length) c = byBody; }
  if (c.length > 1){ const byKind = c.filter(f => /כללית|משלימה/.test(h) ? /משלימה/.test(f.kind || "") : /מקיפה/.test(h) ? /מקיפה/.test(f.kind || "") : true); if (byKind.length) c = byKind; }
  if (c.length > 1){ const act = c.filter(f => f.active); if (act.length) c = act; }
  return c.length === 1 ? c[0] : null;
}

/* קריאת PDF: קודם קריאה ישירה של הטקסט בדפדפן (מהירה וללא עלות).
   אם הקריאה נכשלת או לא מתאימה לסכומי העמוד הראשון — הקובץ נשלח
   לקריאה ממוחשבת, שגם היא נבדקת מול סכומי הדוח. כך דוח במבנה שלא
   הכרנו עדיין נקרא בכל זאת, ומספר שגוי אף פעם לא נכנס לתחשיב. */
const CONTACT_YIFTACH = "צרו קשר עם יפתח ונגר, 050-397-6397.";
async function readMaslakaPdf(buffer, fileName){
  const t = await readMaslakaPdfText(buffer, fileName);
  if (t.scanned || t.fatal) return t;
  const soft = (t.notes || []).length > 0;
  if (!t.error && !soft) return t;
  const a = await readScannedPdf(buffer, fileName, true);
  const aSoft = (a.notes || []).length > 1;
  if (!a.error && !aSoft) return a;
  if (!t.error) return t;
  if (!a.error) return a;
  t.error = /זה לא דוח/.test(t.error) && /זה לא דוח/.test(a.error)
    ? "זה לא דוח ריכוז מוצרים של המסלקה"
    : "לא ניתן היה לקרוא את הדוח בוודאות — הסכומים שנקראו לא תואמים לסכומים בעמוד הראשון של הדוח. " + CONTACT_YIFTACH;
  return t;
}

async function readMaslakaPdfText(buffer, fileName){
  const out = { file: fileName, person: null, funds: [], capital: [], skipped: [], error: "" };
  if (typeof pdfjsLib === "undefined"){
    out.error = "לא ניתן לקרוא PDF כרגע — נסו את קובצי ה־XML"; return out;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let doc;
  try { doc = await pdfjsLib.getDocument({ data: buffer.slice(0) }).promise; }
  catch (e){ out.error = "לא ניתן לפתוח את קובץ ה־PDF"; out.fatal = true; return out; }

  const pages = [];
  for (let n = 1; n <= doc.numPages; n++){
    const tc = await (await doc.getPage(n)).getTextContent();
    pages.push(tc.items.filter(i => i.str && i.str.trim()).map(i => ({
      x: Math.round(i.transform[4]), y: Math.round(i.transform[5]), w: Math.round(i.width || 0), str: i.str.trim()
    })));
  }
  const allRows = pages.map(pdfRows);
  const flat = allRows.flat();

  if (!flat.some(r => r.text.indexOf(DETAIL_HEADER) !== -1)){
    /* קובץ ללא טקסט (נשמר כתמונה / "הדפסה ל־PDF") — קריאה ממוחשבת */
    const chars = flat.reduce((t, r) => t + r.text.length, 0);
    if (chars < 200 * doc.numPages){ const r = await readScannedPdf(buffer, fileName); r.scanned = true; return r; }
    out.error = "זה לא דוח ריכוז מוצרים של המסלקה";
    return out;
  }

  /* ---- פרטי החוסך ---- */
  const head = flat.map(r => r.text).join(" ");
  const first = head.match(/שם פרטי:\s*([^\s]+)/);
  const last  = head.match(/שם משפחה:\s*([^\s]+)/);
  const tz    = head.match(/מס מזהה לקוח:?\s*(\d{5,9})/);
  out.person = {
    name: [last && last[1], first && first[1]].filter(Boolean).join(" "),   /* משפחה ואז פרטי */
    id: tz ? tz[1] : "",
    birth: "",      /* ה־PDF אינו כולל תאריך לידה */
    gender: ""      /* ולא מין */
  };

  /* ---- סכומי הביקורת שבעמוד הראשון ----
     "ריכוז סכומי הצבירה לפי סוגי המוצרים": שורת כותרות של קטגוריות
     ומתחתיה שורת סכומים. משייכים סכום לקטגוריה לפי מיקום. */
  let stated = null, statedAll = null;
  const p1 = allRows[0] || [];
  for (let i = 0; i < p1.length; i++){
    const heads = p1[i].items.filter(it => /קרנות פנסיה|חברות ביטוח|קופות גמל|קרנות השתלמות|גמל להשקעה/.test(norm(it.str)));
    if (!heads.length) continue;
    for (let j = i + 1; j < Math.min(i + 4, p1.length); j++){
      const nums = p1[j].items.filter(it => pdfNum(it.str) != null && /\d/.test(it.str));
      if (nums.length < heads.length) continue;
      let sum = 0, hit = 0;
      for (const h of heads){
        let best = null, dist = 40;
        for (const it of nums){ const d = Math.abs(it.x - h.x); if (d < dist){ dist = d; best = it; } }
        if (!best) continue;
        hit++; sum += pdfNum(best.str) || 0;
        if (norm(h.str).indexOf(PENSION_SECTION) === 0) stated = pdfNum(best.str);
      }
      if (hit === heads.length){ statedAll = sum; break; }
    }
    if (statedAll != null) break;
  }

  /* ---- טבלאות הפירוט ----
     כותרת הטבלה יושבת לא פעם בתחתית עמוד אחד והטבלה עצמה מתחילה
     בעמוד הבא, ולכן קוראים את המסמך כרצף אחד ולא עמוד־עמוד.
     כותרות וכותרות־תחתונות חוזרות מסוננות כדי שלא ישברו טבלה. */
  {
    const rows = flat.filter(r => {
      const t = norm(r.text);
      return !/^עמוד \d+ מתוך/.test(t) && t.indexOf("שם פרטי:") !== 0 && t.indexOf("סוג הבקשה:") !== 0;
    });
    const edge = pdfLabelEdge(rows);
    if (!edge){ out.error = "מבנה הדוח לא זוהה — העלו את קובצי ה־XML"; return out; }

    for (let i = 0; i < rows.length; i++){
      /* כותרת טבלה היא תמיד השורה שאחרי "פירוט המוצרים על פי סוג המוצר".
         כך נתפסות גם כותרות שלא הכרנו מראש, כמו "חברות ביטוח – ריסק טהור". */
      if (rows[i].text.indexOf(DETAIL_HEADER) === -1) continue;
      i++;
      if (i >= rows.length) break;
      const section = norm(rows[i].text);
      if (!section || section.length > 60) continue;
      const isPension = section.indexOf(PENSION_SECTION) === 0;
      /* ביטוח מנהלים, קופות גמל, קרנות השתלמות וגמל להשקעה — כולם
         נכסים הוניים. ריסק טהור ומשכנתא הם כיסוי בלבד, בלי חיסכון. */
      const risk = /ריסק|משכנתא|ביטוח חיים/.test(section);
      const capKind = risk ? ""
                    : /השתלמות/.test(section) ? "קרן השתלמות"
                    : /גמל להשקעה/.test(section) ? "גמל להשקעה"
                    : /קופות גמל|קופת גמל/.test(section) ? "קופת גמל"
                    : /ביטוח מנהלים|חיסכון טהור|חברות ביטוח/.test(section) ? "ביטוח מנהלים" : "";

      /* גוף הטבלה: עד הכותרת הבאה או עד הערות השוליים */
      const body = [];
      for (let j = i + 1; j < rows.length; j++){
        const t = norm(rows[j].text);
        if (t.indexOf(DETAIL_HEADER) !== -1) break;
        if (/^(ראה מקרא|\*|עמוד)/.test(t)) break;
        body.push(rows[j]);
      }
      if (!body.length) continue;

      /* חלק מהתוויות נושאות כוכבית של הערת שוליים. מתעלמים ממנה. */
      const bare = s => norm(s).replace(/[\s*]+$/, "");
      const get = name => {
        for (const r of body){ const s = pdfSplit(r, edge); if (bare(s.label) === bare(name)) return s; }
        return null;
      };
      /* עוגני העמודות: שורת מספר הפוליסה, ואם אין — שם החברה. */
      const acctRow = get("מספר פוליסה") || get("שם חברה מנהלת");
      if (!acctRow || !acctRow.cells.length){
        if (!isPension) out.skipped.push({ body: "", plan: section, acct: "", kind: section, why: ONLY_PENSION });
        continue;
      }
      /* שורת הצבירה מכילה ערך לכל תוכנית, ולכן היא העוגן המדויק ביותר. */
      const balRow = get('סה"כ חיסכון צבור');
      const anchorRow = balRow && balRow.cells.length >= acctRow.cells.length ? balRow : acctRow;
      const anchors = anchorRow.cells.map(pdfCx);
      const col = name => { const s = get(name); return s ? pdfByColumn(s.cells, anchors) : anchors.map(() => null); };

      const company = col("שם חברה מנהלת");
      const accts   = pdfByColumn((get("מספר פוליסה") || { cells: [] }).cells, anchors);
      const kinds   = col("סוג מוצר פנסיוני");
      const status  = col("סטטוס");
      const bal     = col('סה"כ חיסכון צבור');
      const kitz    = col("קיצבה חודשית לגיל פרישה ללא הפקדות כספים נוספות");
      const opened  = col("תאריך פתיחת תכנית");
      const joined  = col("תאריך הצטרפות לראשונה");
      const withdraw = col("מועד זכאות למשיכה בהטבת מס");
      const asOf    = col("תאריך נכונות נתונים");
      const nikuim  = col("מספר תיק ניכויים");

      anchors.forEach((_, k) => {
        const body_ = company[k] || section;
        const acct  = (accts[k] || "").replace(/^0+/, "");
        const kind  = kinds[k] || "";

        const common = {
          body: body_, plan: kind || section, acct,
          opened: pdfDate(opened[k]),
          firstJoined: pdfDate(joined[k]),
          withdrawable: norm(withdraw[k]),
          balance: pdfNum(bal[k]) || 0,
          asOf: pdfDate(asOf[k]),
          active: /^פעיל/.test(status[k] || ""),
          nikuim: (nikuim[k] || "").replace(/\D/g, "")
        };

        /* רק קרן פנסיה חדשה — מקיפה או משלימה/כללית — עוברת היוון. */
        if (isPension && /מקיפה|כללית|משלימה/.test(kind) && !/ותיק/.test(kind)){
          const mashlima = /כללית|משלימה/.test(kind);
          out.funds.push(Object.assign({}, common, {
            plan: [body_, mashlima ? "משלימה" : "מקיפה"].filter(Boolean).join(" "),
            kind: mashlima ? "קרן פנסיה משלימה" : "קרן פנסיה מקיפה",
            kitzba: pdfNum(kitz[k]) || 0,
            gilPrisha: 0
          }));
        } else if (capKind){
          out.capital.push(Object.assign({}, common, {
            plan: [body_, capKind].filter(Boolean).join(" — "),
            kind: capKind,
            hishtalmut: capKind === "קרן השתלמות"
          }));
        } else {
          out.skipped.push(Object.assign({}, common, {
            kind: /ותיק/.test(kind) ? "קרן פנסיה ותיקה" : section,
            why: ONLY_PENSION
          }));
        }
      });
    }
  }

  /* ---- פירוט הפקדות ----
     כל טבלת הפקדות נפתחת בשורת כותרת: סוג המוצר, שם החברה המנהלת ומספר
     הפוליסה. השורות שאחריה שייכות לאותה קופה עד הכותרת הבאה. בכל שורה
     תאריך הערך בקצה הימני, חודש השכר לידו, וכל רכיבי ההפקדה משמאל; שכר
     מדווח אינו הפקדה ולכן אינו נכלל. לכמה קופות יכול להיות אותו מספר
     פוליסה (מספר ת.ז.), ואז הקופה נבחרת לפי שם החברה שבכותרת. */
  {
    let inDeposits = false, target = null, cols = null;
    for (const row of flat){
      const t = row.text;
      if (t.indexOf("פירוט הפקדות") !== -1){ inDeposits = true; target = null; continue; }
      if (!inDeposits) continue;
      if (/פירוט התוכניות|ביטוח למקרה מוות/.test(t)){ inDeposits = false; target = null; continue; }
      if (t.indexOf("מספר פוליסה") !== -1){ target = pickDepositTarget([...out.funds, ...out.capital], t); cols = null; continue; }
      if (!target) continue;
      /* שורת כותרות העמודות: מיקום "הפקדות עובד" ו"תגמולים 47-שכיר".
         הגוף המוסדי רושם הפקדה לפי סעיף 47 גם בעמודת העובד וגם בעמודת 47
         באותו סכום — זו אותה הפקדה, ונספרת פעם אחת. */
      if (t.indexOf("הפקדות עובד") !== -1){
        const at = re => { const it = row.items.find(i => re.test(norm(i.str))); return it ? pdfCx(it) : null; };
        cols = { emp: at(/הפקדות עובד/), s47: at(/47/) };
        continue;
      }
      const dateItem = row.items.find(it => /^\d{2}\/\d{2}\/\d{4}$/.test(norm(it.str)));
      if (!dateItem) continue;
      const monthItem = row.items.find(it => /^\d{2}\/\d{4}$/.test(norm(it.str)));
      const values = row.items
        .filter(it => it.x < (monthItem ? monthItem.x : dateItem.x) - 5 && /^-?[\d,]+(?:\.\d+)?$/.test(norm(it.str)))
        .sort((a, b) => b.x - a.x);
      // העמודה הימנית ביותר אחרי חודש השכר היא "שכר חודשי מדווח" — אינה הפקדה
      let amount = values.slice(1).reduce((sum, it) => sum + (pdfNum(it.str) || 0), 0);
      if (cols && cols.emp != null && cols.s47 != null){
        const near = (x, tol) => values.slice(1).filter(it => Math.abs(pdfCx(it) - x) <= tol).sort((p, q) => Math.abs(pdfCx(p) - x) - Math.abs(pdfCx(q) - x))[0];
        const e = near(cols.emp, 25), s47 = near(cols.s47, 30);
        const ve = e ? pdfNum(e.str) : 0, v47 = s47 ? pdfNum(s47.str) : 0;
        if (e && s47 && e !== s47 && ve > 0 && Math.abs(ve - v47) < 0.005) amount -= v47;
      }
      const salary = values.length ? pdfNum(values[0].str) : null;
      if (amount > 0) (target.deposits || (target.deposits = [])).push({ valueDate: pdfDate(dateItem.str), salaryMonth: monthItem ? norm(monthItem.str) : "", amount: Math.round(amount * 100) / 100, salary, source: "PDF" });
    }
  }

  /* ---- ביקורת: הסכום שנקרא חייב להתאים לסכום המוצהר ---- */
  if (out.funds.length && stated != null){
    const sum = out.funds.reduce((t, f) => t + f.balance, 0);
    if (Math.abs(sum - stated) > 2){
      out.error = `הקריאה מה־PDF לא הסתדרה: נקראו ${ils.format(sum)} מול ${ils.format(stated)} שמופיעים בדוח בקרנות הפנסיה.`;
      out.funds = []; out.capital = []; out.skipped = [];
      return out;
    }
  }
  /* לא נמצא סכום ביקורת בעמוד הראשון — אי אפשר לאמת את הקריאה הישירה.
     ההערה גורמת לקריאה הממוחשבת לנסות לאמת מול הדוח. */
  if (out.funds.length && stated == null){
    out.notes = [`לא נמצא בעמוד הראשון סכום ביקורת לקרנות הפנסיה, ולכן לא ניתן היה לאמת את הסכומים שנקראו. כדאי לבדוק ידנית מול הדוח.`];
  }
  /* ביקורת שנייה, רכה: סך כל מה שנקרא מול סך כל הקטגוריות בעמוד
     הראשון. דוח ה־PDF מציג לעיתים שתי תוכניות על שורה אחת, ואז
     חסר הפרש קטן. לא פוסלים — מציינים, כדי שאיש לא יסתמך בטעות. */
  if (statedAll != null && (out.funds.length || out.capital.length)){
    const all = [...out.funds, ...out.capital, ...out.skipped].reduce((t, f) => t + (f.balance || 0), 0);
    if (Math.abs(all - statedAll) > 2){
      (out.notes || (out.notes = [])).push(`סך הצבירות שנקראו מה־PDF הוא ${ils.format(all)}, ובדוח מופיע ${ils.format(statedAll)} — הפרש של ${ils.format(Math.abs(statedAll - all))}. כדאי לבדוק ידנית.`);
    }
  }
  seqTag(out.funds, "fund"); seqTag(out.capital, "capital"); seqTag(out.skipped, "skip");
  if (!out.funds.length && !out.capital.length && !out.skipped.length) out.error = "לא נמצאו מוצרים בדוח";
  return out;
}

/* מאחד את כל הקבצים שהועלו לתמונה אחת. */
function mergeMaslaka(results){
  const m = { person: null, people: [], funds: [], capital: [], skipped: [], errors: [], notes: [], fileCount: results.length };
  for (const r of results){
    if (r.error){ m.errors.push({ file: r.file, msg: r.error }); continue; }
    if (r.person && r.person.id){
      /* ת.ז. מגיעה מה־XML בלי אפסים מובילים ומה־PDF לעיתים איתם */
      const idKey = String(r.person.id).replace(/\D/g, "").replace(/^0+/, "");
      if (!m.people.some(p => String(p.id).replace(/\D/g, "").replace(/^0+/, "") === idKey)) m.people.push(r.person);
      /* ה־PDF נושא שם ות.ז. אך לא תאריך לידה ומין; ה־XML נושא את
         כולם. מרכיבים אדם אחד מכל מה שיש, ולא לפי סדר ההעלאה. */
      if (!m.person) m.person = Object.assign({}, r.person);
      else for (const k of ["name", "id", "birth", "gender"]) if (!m.person[k] && r.person[k]) m.person[k] = r.person[k];
    }
    m.funds.push(...r.funds);
    m.capital.push(...(r.capital || []));
    if (r.notes) m.notes.push(...r.notes);
    m.skipped.push(...r.skipped);
  }
  /* אותה קופה יכולה להגיע גם מה־XML וגם מה־PDF. מאחדים לפי מספר
     החשבון וסוג הקרן, ולוקחים מכל מקור את מה שיש רק בו: תיק
     הניכויים קיים רק ב־PDF, גיל הפרישה רק ב־XML. */
  const by = new Map();
  for (const f of m.funds){
    const k = `${f.acct}|${f.dk}|${f.seq}`;
    const prev = by.get(k);
    if (!prev){ by.set(k, Object.assign({}, f)); continue; }
    for (const key of Object.keys(f)){
      const v = f[key];
      if (key === "deposits" && Array.isArray(v) && v.length){ prev.deposits = v; continue; }
      if (v !== "" && v !== 0 && v != null && !prev[key]) prev[key] = v;
    }
  }
  m.funds = [...by.values()];
  /* קבצים של שני אנשים שונים אצל אותו צד — הקופות של שניהם היו
     מתערבבות לתחשיב אחד. עוצרים ומבקשים להפריד. */
  if (m.people.length > 1){
    m.mixed = true;
    m.errors.push({ file: "", msg: `הקבצים שהועלו שייכים ליותר מאדם אחד (${m.people.map(p => [p.name, p.id].filter(Boolean).join(" ")).join(" · ")}). יש להעלות לכל צד רק את הדוחות שלו.` });
  }

  const capBy = new Map();
  for (const c of m.capital){
    /* שתי תוכניות יכולות לחלוק מספר פוליסה — שם התוכנית הוא חלק
       מהזהות, אחרת אחת מהן נעלמת מהתחשיב בלי שאיש ישים לב. */
    const k = `${c.acct}|${c.dk}|${c.seq}`;
    const prev = capBy.get(k);
    if (!prev){ capBy.set(k, Object.assign({}, c)); continue; }
    for (const key of Object.keys(c)){
      const v = c[key];
      if (key === "deposits" && Array.isArray(v) && v.length){ prev.deposits = v; continue; }
      if (v !== "" && v !== 0 && v != null && !prev[key]) prev[key] = v;
    }
  }
  m.capital = [...capBy.values()];

  /* מוצר שכבר נכנס לתחשיב לא צריך להופיע גם ברשימת "דורש טיפול". */
  const taken = new Set([...m.funds, ...m.capital].map(f => f.acct));
  const seenSkip = new Set();
  m.skipped = m.skipped.filter(s => {
    /* שתי תוכניות יכולות לחלוק מספר פוליסה. עדיף לרשום את שתיהן
       מאשר להסתיר אחת ממי שצריך לטפל בהן. */
    const k = `${s.acct}|${s.dk}|${s.seq}`;
    if (seenSkip.has(k)) return false;
    seenSkip.add(k);
    return !(s.acct && taken.has(s.acct) && /פנסיה|גמל|השתלמות/.test(s.kind));
  });
  return m;
}

/* קורא את מה שהמשתמש גרר או בחר: קובצי XML, או ZIP שמכיל אותם. */
async function filesToResults(fileList){
  const results = [];
  for (const file of fileList){
    const lower = file.name.toLowerCase();
    if (lower.endsWith(".zip")){
      if (typeof JSZip === "undefined"){
        results.push({ file: file.name, error: "לא ניתן לפתוח קובץ ZIP כרגע — נסו להעלות את קובצי ה־XML עצמם", funds: [], capital: [], skipped: [] });
        continue;
      }
      try {
        const zip = await JSZip.loadAsync(file);
        const entries = Object.values(zip.files).filter(e => !e.dir && e.name.toLowerCase().endsWith(".xml"));
        if (!entries.length) results.push({ file: file.name, error: "ה־ZIP אינו מכיל קובצי XML", funds: [], capital: [], skipped: [] });
        for (const e of entries) results.push(readMaslakaXml(await e.async("string"), e.name.split("/").pop()));
      } catch (err){
        results.push({ file: file.name, error: "לא ניתן לפתוח את קובץ ה־ZIP", funds: [], capital: [], skipped: [] });
      }
    } else if (lower.endsWith(".xml")){
      results.push(readMaslakaXml(await file.text(), file.name));
    } else if (lower.endsWith(".pdf")){
      results.push(await readMaslakaPdf(await file.arrayBuffer(), file.name));
    } else {
      results.push({ file: file.name, error: "סוג קובץ שאינו נתמך — נדרש PDF, XML או ZIP מהמסלקה", funds: [], capital: [], skipped: [] });
    }
  }
  return results;
}

/* מעביר את מה שנקרא אל נתוני הצד. */
function addCalendarMonths(date, count){
  const d = new Date(date.getTime());
  const day = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + count);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last));
  return d;
}
function monthStart(date){ return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1)); }
function monthLabel(from, to){
  const months = (to.getUTCFullYear() - from.getUTCFullYear()) * 12 + to.getUTCMonth() - from.getUTCMonth();
  return months === 0 ? "אותו חודש" : `${months} ${months === 1 ? "חודש" : "חודשים"}`;
}
/* חודש משכורת בכל הצורות שמופיעות בדוחות: 06/2025 (PDF), 202506 או
   20250601 (XML), 062025, 2025-06. מחזיר את תחילת החודש, או null. */
function parseSalaryMonth(v){
  const s = String(v || "").trim();
  const ok = (y, m) => y >= 1950 && y <= 2100 && m >= 1 && m <= 12 ? new Date(Date.UTC(y, m - 1, 1)) : null;
  let m;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})?$/)) && ok(+m[1], +m[2])) return ok(+m[1], +m[2]);
  if ((m = s.match(/^(\d{2})(\d{4})$/)))          return ok(+m[2], +m[1]);
  if ((m = s.match(/^(\d{4})[\/.\-](\d{1,2})(?:[\/.\-]\d{1,2})?$/))) return ok(+m[1], +m[2]);
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))) return ok(+m[3], +m[2]);
  if ((m = s.match(/(\d{1,2})[\/.\-](\d{2,4})(?!\d)/))){ let y = +m[2]; if (y < 100) y += 2000; return ok(y, +m[1]); }
  return null;
}
/* חציון — לא מושפע מהפקדה חריגה אחת (תיקון, השלמה רטרואקטיבית) */
function median(xs){
  const v = xs.filter(x => isFinite(x)).sort((p, q) => p - q);
  if (!v.length) return 0;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}
const monthKey = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;

/* התאמת יתרה וקצבה למועד הקרע — כמו בחוות הדעת של יפתח:
   1. נגרעות ההפקדות בפועל בגין חודשי שכר שמתחילים במועד הקרע או אחריו
      ושנכנסו עד תאריך נכונות הדוח.
   2. חודשי שכר שאחרי הקרע שקודמים לתחילת פירוט ההפקדות בדוח (הדוח מפרט
      רק את החודשים האחרונים) — מוערכים לפי ההפקדה החודשית החציונית, והדוח
      אומר זאת במפורש. חודש שחסר בתוך התקופה המפורטת — לא הופקד, ואינו מוערך.
   3. העברת כספים (ניוד) — שורה ללא שכר מדווח בסכום חריג — אינה הפקדה על
      עבודה שאחרי הקרע ואינה נגרעת; היא מצוינת בדוח. */
function adjustFundToBreak(f, breakDate){
  const asOf = parseDate(f.asOf);
  const base = Object.assign({}, f, { originalBalance: f.balance, originalKitzba: f.kitzba, deducted: 0, deductedActual: 0,
    estimatedMonths: [], estimatedMonthly: 0, transfers: [], adjustmentStatus: "ok", adjustmentMessage: "" });
  if (!breakDate){ base.adjustmentStatus = "pending"; base.adjustmentMessage = "יש למלא את מועד הקרע כדי לבדוק את הדוח"; return base; }
  if (!asOf){ base.adjustmentStatus = "blocked"; base.adjustmentMessage = "תאריך נכונות הנתונים חסר; נדרש דוח תקופתי מחברת הביטוח"; return base; }
  if (asOf < breakDate){ base.adjustmentStatus = "blocked"; base.adjustmentMessage = `הדוח מוקדם ממועד הקרע (מועד הקרע ${fmtD(breakDate)}, הדוח נכון ל־${fmtD(asOf)}); נדרש דוח מעודכן המכסה את מועד הקרע`; return base; }
  if (asOf.getTime() === breakDate.getTime()){ base.adjustmentMessage = "הדוח נכון למועד הקרע — לא נדרש קיזוז"; return base; }
  const deposits = Array.isArray(f.deposits) ? f.deposits : [];
  // קופה שהגוף המוסדי מדווח עליה כ"לא פעילה" ואין בה הפקדות — אין מה לקזז.
  if (f.active === false && !deposits.length){ base.adjustmentMessage = "קופה לא פעילה ללא הפקדות — לא נדרש קיזוז"; return base; }

  const dated = deposits.filter(d => parseDate(d.valueDate));
  /* ניוד: שכר מדווח 0, סכום של עשרות אלפים ופי חמישה לפחות מהפקדה רגילה */
  const typical = median(dated.map(d => d.amount));
  const isTransfer = d => d.salary === 0 && d.amount >= 10000 && d.amount > 5 * typical;
  base.transfers = dated.filter(isTransfer);
  const regular = dated.filter(d => !isTransfer(d));

  /* חודש שכר שמתחיל במועד הקרע או אחריו — אחרי הקרע. קרע ב־1 בחודש: שכר
     אותו חודש כולו אחרי הקרע; קרע באמצע החודש: שכר חודש הקרע נשאר בשותפות. */
  const isPost = d => { const sm = parseSalaryMonth(d.salaryMonth); return sm ? sm >= breakDate : parseDate(d.valueDate) > breakDate; };
  /* הפקדה שנכנסה אחרי תאריך נכונות היתרה אינה כלולה ביתרה — אין מה לקזז */
  const after = regular.filter(d => parseDate(d.valueDate) <= asOf && isPost(d));
  const actual = Math.round(after.reduce((sum, d) => sum + d.amount, 0) * 100) / 100;

  /* חודשי השכר שאחרי הקרע שההפקדה בגינם כבר ביתרה: ההפקדה נכנסת בחודש
     שאחרי חודש השכר, ולכן עד החודש שלפני תאריך נכונות הדוח. */
  const firstPost = breakDate.getUTCDate() === 1 ? monthStart(breakDate) : utcDate(breakDate.getUTCFullYear(), breakDate.getUTCMonth() + 1, 1);
  const lastInBalance = utcDate(asOf.getUTCFullYear(), asOf.getUTCMonth() - 1, 1);
  const listedMonths = regular.map(d => parseSalaryMonth(d.salaryMonth)).filter(Boolean).sort((p, q) => p - q);
  const firstListed = listedMonths[0] || (regular.length ? monthStart(regular.map(d => parseDate(d.valueDate)).sort((p, q) => p - q)[0]) : null);
  const missing = [];
  for (let m = firstPost; m <= lastInBalance && (!firstListed || m < firstListed); m = utcDate(m.getUTCFullYear(), m.getUTCMonth() + 1, 1)) missing.push(m);

  let estimate = 0;
  if (missing.length){
    if (f.active === false && !regular.length){ /* קופה לא פעילה — אין הפקדות להעריך */ missing.length = 0; }
    else {
      const perMonth = new Map();
      for (const d of regular){ const sm = parseSalaryMonth(d.salaryMonth); const k = sm ? monthKey(sm) : monthKey(parseDate(d.valueDate)); perMonth.set(k, (perMonth.get(k) || 0) + d.amount); }
      const monthly = Math.round(median([...perMonth.values()]) * 100) / 100;
      if (!(monthly > 0)){
        base.adjustmentStatus = "blocked";
        base.adjustmentMessage = "אין בדוח פירוט הפקדות שממנו אפשר לקזז את התקופה שממועד הקרע; נדרש דוח תקופתי מחברת הביטוח";
        return base;
      }
      base.estimatedMonthly = monthly;
      estimate = Math.round(monthly * missing.length * 100) / 100;
    }
  }
  base.estimatedMonths = missing.map(m => `${String(m.getUTCMonth() + 1).padStart(2, "0")}/${m.getUTCFullYear()}`);
  const deducted = Math.round((actual + estimate) * 100) / 100;
  if (deducted > f.balance){ base.adjustmentStatus = "blocked"; base.adjustmentMessage = "סכום ההפקדות המאוחרות גדול מהיתרה המדווחת; נדרש דוח תקופתי מחברת הביטוח"; return base; }
  base.deducted = deducted;
  base.deductedActual = actual;
  base.balance = Math.round((f.balance - deducted) * 100) / 100;
  if (typeof f.kitzba === "number" && f.balance > 0) base.kitzba = Math.round((f.kitzba * base.balance / f.balance) * 100) / 100;
  const parts = [];
  if (actual > 0) parts.push(`קוזזו הפקדות בפועל בסך ${ils.format(actual)}`);
  if (estimate > 0){ base.adjustmentStatus = "estimated"; parts.push(`וקיזוז מוערך של ${missing.length} ${missing.length === 1 ? "חודש" : "חודשים"} (${base.estimatedMonths.join(", ")}) לפי הפקדה חודשית של ${ils.format(base.estimatedMonthly)}`); }
  if (base.transfers.length) parts.push(`ניוד של ${ils.format(base.transfers.reduce((t, d) => t + d.amount, 0))} לא קוזז`);
  base.adjustmentMessage = parts.length ? parts.join("; ") : "לא נמצאו הפקדות לאחר מועד הקרע";
  return base;
}
function refreshMaslakaAdjustment(i){
  const p = state.people[i], t = p.intake;
  if (!t || !t.rawFunds) return;
  const brk = parseDate($("#breakDate").value);
  t.funds = t.rawFunds.map(f => adjustFundToBreak(f, brk));
  t.capital = (t.rawCapital || []).map(c => adjustFundToBreak(c, brk));
  t.blocked = !!t.mixed || [...t.funds, ...t.capital].some(f => f.adjustmentStatus === "blocked" || f.adjustmentStatus === "pending");
  const held = f => f.balance > 0 || f.kitzba > 0;
  /* יחס השיתוף נמדד מתחילת הוותק בקופה — ההצטרפות הראשונה — ולא ממועד
     פתיחת התוכנית הנוכחית, שמתאפס בכל ניוד. */
  const seniority = f => { const d = [f.firstJoined, f.opened].filter(x => parseDate(x)).sort()[0]; return d || f.opened; };
  p.funds = t.funds.filter(held).map(f => ({ name: f.plan, acct: f.acct, amount: Math.round(f.kitzba * 100) / 100, opened: seniority(f), body: f.body, nikuim: f.nikuim || "", gilPrisha: f.gilPrisha || 0, adjustment: f }));
  p.balances = t.funds.filter(held).map(f => ({ name: f.plan, amount: Math.round(f.balance * 100) / 100, adjustment: f }));
  const prevExclude = new Map((p.capital || []).filter(c => c.adjustment).map(c => [`${c.adjustment.acct}|${c.adjustment.seq}`, !!c.exclude]));
  p.capital = t.capital.map(c => {
    let liquid = false;
    if (c.hishtalmut && brk) liquid = studyFundLiquidAt(c, brk);
    return { name: c.plan, kind: c.kind, acct: c.acct, body: c.body, nikuim: c.nikuim || "", taxable: /השתלמות|להשקעה/.test(String(c.kind || "") + " " + String(c.plan || "")),
             amount: Math.round(c.balance * 100) / 100, liquid, opened: seniority(c), adjustment: c,
             exclude: prevExclude.get(`${c.acct}|${c.seq}`) || false };
  });
}
/* בדיקות סבירות על מה שנקרא — לא פוסלות, אבל מסמנות מה לבדוק מול הדוח.
   קצבה ללא המשך הפקדות היא בדרך כלל אחוזים בודדים מהצבירה; קצבה של יותר
   מעשירית הצבירה מעידה כמעט תמיד על קריאה של עמודה או שורה שגויה. */
function plausibilityNotes(m){
  const notes = [];
  for (const f of m.funds || []){
    const label = [f.plan, f.acct ? "חשבון " + f.acct : ""].filter(Boolean).join(" · ");
    if (f.balance > 0 && !(f.kitzba > 0))
      notes.push(`${label}: לא נקראה קצבה חודשית לגיל פרישה. יש להזין אותה ידנית מהדוח — בלעדיה הקופה אינה מהוונת.`);
    else if (f.balance > 0 && f.kitzba > f.balance * 0.1)
      notes.push(`${label}: הקצבה שנקראה (${ils.format(f.kitzba)}) גבוהה באופן חריג ביחס לצבירה (${ils.format(f.balance)}). כדאי לבדוק מול הדוח.`);
    if (f.opened && f.asOf && parseDate(f.opened) && parseDate(f.asOf) && parseDate(f.opened) > parseDate(f.asOf))
      notes.push(`${label}: תאריך הפתיחה מאוחר מתאריך נכונות הנתונים. כדאי לבדוק מול הדוח.`);
  }
  return notes;
}
/* האם קרן ההשתלמות הייתה נזילה (פטורה ממס) במועד הקרע. עדיף תאריך הזכאות
   שהגוף המוסדי מדווח; אחרת שש שנים מההצטרפות הראשונה — לא ממועד פתיחת
   התוכנית, שמתאפס בכל ניוד. "ניתן למשיכה" מתאר את מועד הדוח, לא את הקרע. */
function studyFundLiquidAt(c, brk){
  const eligible = parseDate(pdfDate(c.withdrawable || "")) || parseDate(c.withdrawable);
  if (eligible) return eligible <= brk;
  const starts = [parseDate(c.firstJoined), parseDate(c.opened)].filter(Boolean).sort((a, b) => a - b);
  if (!starts.length) return false;
  const six = new Date(starts[0].getTime()); six.setUTCFullYear(six.getUTCFullYear() + 6);
  return six <= brk;
}
function applyMaslaka(i, m){
  const p = state.people[i];
  const got = { birth: false, gender: false };
  if (m.person){
    if (m.person.name) p.name = m.person.name;
    if (m.person.id)   p.id   = m.person.id;
    /* דוח PDF אינו נושא תאריך לידה ומין. אסור להשאיר את ערכי
       הדוגמה — הם היו מייצרים תחשיב שגוי בשקט. מנקים ומבקשים. */
    p.birth  = m.person.birth  || "";
    p.gender = m.person.gender || "";
    got.birth  = !!m.person.birth;
    got.gender = !!m.person.gender;
  }
  p.intake = { rawFunds: m.funds, rawCapital: m.capital, funds: [], capital: [], skipped: m.skipped,
               errors: m.errors, notes: [...m.notes, ...plausibilityNotes(m)], fileCount: m.fileCount, got, mixed: !!m.mixed };
  refreshMaslakaAdjustment(i);
}

/* ספרת ביקורת של תעודת זהות ישראלית (אלגוריתם לוהן, עם ריפוד ל־9 ספרות) */
function validIsraeliId(id){
  const s = String(id || "").replace(/\D/g, "");
  if (s.length < 5 || s.length > 9 || /^0+$/.test(s)) return false;
  const p = s.padStart(9, "0");
  let sum = 0;
  for (let k = 0; k < 9; k++){ let d = +p[k] * (k % 2 ? 2 : 1); if (d > 9) d -= 9; sum += d; }
  return sum % 10 === 0;
}

    [/^\d{5,9}$/.test(digits), `#tz${i}`, "יש למלא מספר תעודת זהות תקין"],

    const fields = [
      ["#breakDate", "יש למלא את מועד הקרע"], ["#marriage", "יש למלא את מועד תחילת השותפות"],
      ["#court", "יש למלא את שם הערכאה"], ["#caseNo", "יש למלא את מספר התיק"],
      ["#opinionDate", "יש למלא את תאריך עריכת חוות הדעת"], ["#expName", "יש למלא את שם עורך חוות הדעת"],

      ["#expTitle", "יש למלא את התואר המקצועי"],

    for (const [selector, message] of fields){

      if (!el || !String(el.value || "").trim()){ markWizardInvalid(selector); return message; }
    }
    const brk = parseDate($("#breakDate").value), start = parseDate($("#marriage").value);
    if (!brk){ markWizardInvalid("#breakDate"); return "מועד הקרע אינו תאריך תקין"; }
    if (!start){ markWizardInvalid("#marriage"); return "מועד תחילת השותפות אינו תאריך תקין"; }
    if (start >= brk){ markWizardInvalid("#marriage"); return "מועד תחילת השותפות חייב להיות לפני מועד הקרע"; }
    const tooEarly = state.people.find(q => parseDate(q.birth) && start < parseDate(q.birth));
    if (tooEarly){ markWizardInvalid("#marriage"); return `מועד תחילת השותפות מוקדם מתאריך הלידה של ${tooEarly.name || tooEarly.tag}`; }
    for (const [ret, life, who] of [["#retM", "#lifeM", "גבר"], ["#retF", "#lifeF", "אישה"]]){

      if (!(l >= ASSUME_LIMITS.life[0] && l <= ASSUME_LIMITS.life[1])){ markWizardInvalid(life); return `תוחלת החיים (${who}) חייבת להיות בין ${ASSUME_LIMITS.life[0]} ל־${ASSUME_LIMITS.life[1]}`; }
      if (l <= r){ markWizardInvalid(life); return `תוחלת החיים (${who}) חייבת להיות גבוהה מגיל הפרישה`; }

  return "";

/* Clicking a step in the bar: earlier steps open directly; later steps advance

document.getElementById("wizardProgress").addEventListener("click", e => {

/* סכום האיזון: לכל צד — חלק בן הזוג בפנסיה המהוונת (שווי × שיעור העברה),
   ובנכסים ההוניים — החלק המשותף נטו ממס. החיובי = צד א׳ משלם לצד ב׳. */
function balanceSummary(people){
  let payA = 0, payB = 0, capA = 0, capB = 0, cashA = 0, cashB = 0;
  people.forEach(([, r], idx) => {
    (r.funds || []).forEach(f => {
      if (!(f.amount > 0)) return;
      const due = f.atBreakEarly * f.sh.share;
      if (idx === 0) payA += due; else payB += due;
    });
    (r.capItems || []).forEach(c => {
      if (!(c.value > 0)) return;
      if (idx === 0) capA += c.marital; else capB += c.marital;
      if (!c.psikta){ if (idx === 0) cashA += c.marital; else cashB += c.marital; }
    });
  });
  const pen = payA - payB, cap = (capA - capB) / 2, total = pen + cap, cash = (cashA - cashB) / 2;
  return {
    payA, payB, capA, capB, pen, cap, total, cash,
    cashNet: Math.abs(cash), cashPayer: cash >= 0 ? 0 : 1,
    penNet: Math.abs(pen), capDiff: Math.abs(capA - capB), capNet: Math.abs(cap), totalNet: Math.abs(total),
    penPayer: pen >= 0 ? 0 : 1, capPayer: cap >= 0 ? 0 : 1, totalPayer: total >= 0 ? 0 : 1
  };
}

  const detail = people.map(([p, r], i) => (!r.valid || i === noRightsIdx) ? "" : `

  /* One פסיקתה per fund, laid out as in the signed opinions: addressee block,

     policies and provident/investment accounts are handled separately. */
  /* כל מה שמקבל פסיקתא, ממוספר פעם אחת: קרנות הפנסיה ואחריהן קופות הגמל
     של כל צד. קופה שנפתחה אחרי מועד הקרע — שיעור ההעברה 0%, ואין לה פסיקתא. */
  const psiktaSeq = new Map();
  const psiktaList = [];
  people.forEach(([p, r], i) => {
    r.funds.forEach(f => { if (f.amount > 0 && !f.sh.afterBreak) psiktaList.push({ p, i, f }); });
    (r.capItems || []).forEach(c => { if (c.psikta && !c.excluded && c.value > 0 && c.sh.share > 0)
      psiktaList.push({ p, i, f: Object.assign({}, c, { opened: parseDate(c.opened) }), src: c }); });
  });
  psiktaList.forEach((x, k) => psiktaSeq.set(x.src || x.f, k + 1));

  function psiktaCards(){
    const cards = [];
    psiktaList.forEach(({ p, i, f }, k) => {

      const spouseF = spouse.gender === "female";
      {

            <p class="ps-body">בהתאם לפסק הדין שניתן${court ? " ע״י " + escapeAttr(court) : ""}, להלן פרטי הצדדים וכן השיעור להעברה בהתאם לחוק לחלוקת חיסכון פנסיוני בין בני זוג שנפרדו, התשע״ד (2014). נבקשכם לפעול בהתאם לחוק זה.</p>

  /* The complete expert opinion, in the structure of the signed reports:
     cover letter, declaration, assumptions, the פסיקתות, the discounted
     alternative, and the comparison between the two. */
  function opinionDoc(){
    const cards = psiktaCards();
    if (!cards.length) return "";
    const v = id => { const el = $("#" + id); return el ? el.value.trim() : ""; };
    const expName = v("expName") || "עורך חוות הדעת";
    const today = opinionDate && !isNaN(opinionDate) ? dateFmt(opinionDate) : dateFmt(new Date());
    const cv = v("expCv").split("\n").map(x => x.trim()).filter(Boolean);
    const licenses = v("expLicenses").split("\n").map(x => x.trim()).filter(Boolean);
    const A0 = state.people[0], B0 = p2;
    const adjustedFunds = state.people.flatMap(p => ([...((p.intake && p.intake.funds) || []), ...((p.intake && p.intake.capital) || [])])
      .filter(f => f.adjustmentStatus === "ok" || f.adjustmentStatus === "estimated")
      .map(f => ({ owner: p.name, fund: f })));

    const assumptions = [
      ["תאריך עריכת חוות הדעת:", today],

      ["הנחת גיל פרישה של האישה:", String(retireAge("female"))],
      ["הנחת תוחלת חיים — גבר (הלמ״ס):", String(lifeAge("male"))],
      ["הנחת תוחלת חיים — אישה (הלמ״ס):", String(lifeAge("female"))],
      ["שיעור ההיוון השנתי:", (rate * 100).toFixed(2) + "%"],
      ["", "כל תוצאות החישובים בחוות דעת זו נכונות למועד החישוב, למעט במקומות בהם צוין אחרת."],
      ["", "כל הסכומים בחוות דעת זו נקובים בש״ח."]
    ];

    const rows = [];
    const { payA, payB } = bal;   /* חלק מגיע, per side */
    people.forEach(([p, r]) => r.funds.forEach(f => {
      if (!(f.amount > 0)) return;
      const due = f.atBreakEarly * f.sh.share;
      rows.push(`<tr>
        <td>${escapeAttr(f.name || "—")} — ${escapeAttr(p.name)}</td>
        <td>${escapeAttr(f.body || "—")}</td>
