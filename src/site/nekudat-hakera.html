    }));
    /* הצדדים מזוהים לפי מקומם (0 = צד א׳, 1 = צד ב׳) ולא לפי השם —
       שני שמות זהים או ריקים לא יבלבלו את כיוון התשלום ואת לשון הפנייה. */
    const P = [A0, B0];
    /* חודש הדוחות — מתאריכי נכונות הנתונים שנקראו בפועל, לא תאריך קבוע */
    const HEB_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
    const reportMonths = [...new Set(state.people.flatMap(p => [...((p.intake && p.intake.funds) || []), ...((p.intake && p.intake.capital) || [])])
      .map(f => parseDate(f.asOf)).filter(Boolean).sort((x, y) => x - y)
      .map(d => `${HEB_MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`))];
    const sourcesLine = reportMonths.length
      ? `יתרות מסלקה פנסיונית נכונות ל${reportMonths.length > 1 ? "חודשים " + reportMonths.join(", ") : "חודש " + reportMonths[0]} ודוחות תקופתיים של גמל ופנסיה.`
      : "יתרות מסלקה פנסיונית ודוחות תקופתיים של גמל ופנסיה שנמסרו לי.";
    const nm = i => P[i].name;
    const penNet = bal.penNet, penPayer = bal.penPayer, penPayee = 1 - penPayer;

    /* Capital assets: the report lists them per party with the share, then
       subtotals each side, takes the difference and halves it. */
    const capRows = [];
    const inactive = [];
    const notBalanced = [];
    let cgA = 0, cgB = 0;
    people.forEach(([p, r]) => (r.capItems || []).forEach(c => {
      const amt = c.value || 0;
      if (!(amt > 0)) return;
      if (c.excluded){ notBalanced.push({ p, c }); return; }
      const pct = `${(c.sh.share * 100).toFixed(2)}%`;
      if (c.atRetire){
        inactive.push({ p, r, c });
        capRows.push(`<tr>
          <td>${escapeAttr(p.name)} — ${escapeAttr(c.name || "פנסיה לא פעילה")}, ${ils.format(Number(c.amount) || 0)} בגיל פרישה</td>
          <td>היוון סכום חד־פעמי למועד הקרע</td>
          <td class="n">${ils.format(amt)}</td>
          <td class="n">${pct}</td>
        </tr>`);
        return;
      }
      capRows.push(`<tr>
        <td>${escapeAttr(p.name)} — ${escapeAttr(c.name || "—")}</td>
        <td>${psiktaSeq.has(c) ? `דוח מסלקה · פסיקתא ${psiktaSeq.get(c)}` : "דוח שנתי ודוח מסלקה"}</td>
        <td class="n">${ils.format(amt)}</td>
        <td class="n">${pct}</td>
      </tr>`);
    }));
    const counted = people.flatMap(([, r]) => (r.capItems || []).filter(c => !c.excluded && c.value > 0));
    const kindOf = c => `${c.name || ""} ${c.kind || ""}`;
    const hasStudy = counted.some(c => !c.atRetire && /השתלמות/.test(kindOf(c)));
    const capKinds = [
      hasStudy && "קרן השתלמות",
      counted.some(c => !c.atRetire && /להשקעה/.test(kindOf(c))) && "גמל להשקעה",
      counted.some(c => !c.atRetire && !/השתלמות|להשקעה/.test(kindOf(c))) && "קופות גמל",
      inactive.length && "פנסיה לא פעילה",
    ].filter(Boolean);
    const capTitle = capKinds.length ? capKinds.slice(0, -1).join(", ") + (capKinds.length > 1 ? " ו" : "") + capKinds[capKinds.length - 1] : "קרן השתלמות וגמל להשקעה";
    const skippedAll = people.flatMap(([p]) => ((p.intake && p.intake.skipped) || []).filter(x => x.balance > 0));
    cgA = a.capGainsTax; cgB = b.capGainsTax;
    /* Totals are the marital portion of each side (net of tax × date ratio). */
    const totA = bal.capA, totB = bal.capB;
    const capDiff = bal.capDiff;
    const capNet = bal.capNet;
    const capPayer = bal.capPayer, capPayee = 1 - capPayer;
    /* בחלופה א׳ קופות הגמל עוברות בפסיקתא; במזומן נשאר רק מה שאין לו פסיקתא */
    const cashNet = bal.cashNet, cashPayer = bal.cashPayer, cashPayee = 1 - cashPayer;
    const hasGemelPsikta = people.some(([, r]) => (r.capItems || []).some(c => psiktaSeq.has(c)));

    /* "ישלם" or "תשלם", by the payer's gender */
    const genderOf  = i => P[i].gender;
    const payVerb   = i => genderOf(i) === "female" ? "תשלם"  : "ישלם";
    const transVerb = i => genderOf(i) === "female" ? "תעביר" : "יעביר";
    /* Names are entered surname first (as in the clearing-house reports),
       so the personal name is the last word. */
    const first = i => { const n = String(nm(i) || "").trim(); return n.split(/\s+/).slice(-1)[0] || n; };
    const nf0 = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 0 });
    const noPension = state.rightsHolder === "a" ? B0.name : state.rightsHolder === "b" ? A0.name :
      (() => { const has = [0, 1].map(i => psiktaList.some(x => x.i === i));
               return has[0] && !has[1] ? B0.name : has[1] && !has[0] ? A0.name : ""; })();
    /* The single displayed alternative nets capital and pension in cash. */
    const altBnet = bal.totalNet;
    const altBpayer = bal.totalPayer, altBpayee = 1 - altBpayer;

    return `
    <div class="doc" id="opinionDoc">
      <div class="doc-block">
        <div class="doc-meta"><span>${today}</span><span>${escapeAttr(caseNo || "")}</span></div>
        <div class="doc-cover-title">
          <h2>דוח איזון משאבים</h2>
          <div class="doc-cover-names">${escapeAttr(A0.name)} ו${escapeAttr(B0.name)}</div>
          <p>חוות דעת כלכלית — תחשיב איזון משאבים על ידי מומחה כלכלן, יועץ פנסיוני, יועץ השקעות, מומחה רשום בבתי המשפט, חבר התאחדות יועצי המימון וחבר בדרגת עמית לומד באגודת האקטוארים בישראל</p>
        </div>

        <p>בהתאם לבקשת הצדדים ובאי כוחם, רצ״ב חוות דעתי לאיזון משאבי חיסכון פנסיוני וגמל.</p>
        <p>חוות הדעת כוללת שתי חלופות לאיזון זכויות הצדדים:</p>
        <ul class="doc-list">

          <li><strong>חלופה ב׳:</strong> חישוב הערך המהוון של הזכויות הפנסיוניות עד המועד המוקדם מבין תוחלות החיים של בני הזוג, בתוספת שיערוך יתר הנכסים.</li>
        </ul>
        <div class="doc-sign">בכבוד רב,<br><strong>${escapeAttr(expName)}</strong><br>${escapeAttr(v("expTitle"))}</div>
      </div>

      <div class="doc-block">
        <h3>הצהרת עורך חוות הדעת</h3>
        <p>אני, ${escapeAttr(expName)}${v("expId") ? ", נושא ת.ז. " + escapeAttr(v("expId")) : ""}${v("expAddr") ? ", מ" + escapeAttr(v("expAddr")) : ""}, נתבקשתי לחוות את דעתי המקצועית.</p>
        <p>הנני מצהיר כי אין לי כל עניין אישי בנושא חוות הדעת, וכי חוות הדעת נערכה לפי מיטב ידיעתי והכשרתי המקצועית, ומתוך אמונה כי העובדות שהובאו בחוות הדעת ונספחיה הן אמת, והמסקנות שקבעתי לפיכך נכונות.</p>

        ${cv.length ? `<h4>השכלה וניסיון מקצועי</h4><ul class="doc-list">${cv.map((x, i) => {

        ${licenses.length ? `<h4>רישיונות והסמכות</h4><ul class="doc-list">${licenses.map(x => `<li>${escapeAttr(x)}</li>`).join("")}</ul>` : ""}
      </div>

      <div class="doc-block">
        <h3>פרק 1 — נתונים והנחות</h3>

            ? `<tr><td>${"1." + (i + 1)}</td><td>${a[0]}</td><td class="n">${a[1]}</td></tr>`

/* Measure at the same A4 width for the document, preview and PDF. Split long
   tables and lists at row/item boundaries, never through text or letterhead. */
function paginateOpinionDoc(){
  const doc = $("#opinionDoc");
  if (!doc) return;
  const measure = document.createElement("div");
  measure.style.cssText = "position:fixed;left:-10000px;top:0;width:900px;visibility:hidden;pointer-events:none";
  document.body.appendChild(measure);
  const pages = [];
  let page, content;
  const newPage = () => {
    page = document.createElement("div");
    page.className = "doc-block";
    content = document.createElement("div");
    content.className = "doc-page-content";
    page.appendChild(content);
    measure.replaceChildren(page);
    pages.push(page);
  };
  const fits = () => content.getBoundingClientRect().height <= 945;
  const append = node => {
    content.appendChild(node);
    if (fits() || content.children.length === 1) return;
    node.remove();
    const last = content.lastElementChild;
    const heading = last && /^(H3|H4)$/.test(last.tagName) ? last : null;
    if (heading) heading.remove();
    newPage();
    if (heading) content.appendChild(heading);
    content.appendChild(node);
  };
  const prepareTable = table => {
    const group = document.createElement("colgroup");
    const count = [...(table.rows[0]?.cells || [])].reduce((n, cell) => n + cell.colSpan, 0);
    for (let i = 0; i < count; i++){
      const col = document.createElement("col");
      if (table.classList.contains("chapter-one")) col.className = ["doc-number-col", "doc-label-col", "doc-value-col"][i];
      else if (i === 0) col.className = "doc-name-col";
      group.appendChild(col);
    }
    table.prepend(group);
  };
  try {
    for (const source of [...doc.children]){
      newPage();
      for (const original of [...source.children]){
        const node = original.cloneNode(true);
        if (node.tagName === "TABLE"){
          prepareTable(node);
          const rows = [...node.querySelectorAll("tbody > tr")];
          node.querySelector("tbody")?.replaceChildren();
          let table = node;
          for (const row of rows){
            if (!table.parentElement) append(table);
            table.querySelector("tbody").appendChild(row);
            if (!fits() && table.querySelector("tbody").children.length > 1){
              row.remove();
              newPage();
              table = node.cloneNode(true);
              table.querySelector("tbody").replaceChildren(row);
              content.appendChild(table);
            } else if (!fits() && content.children.length > 1){
              table.remove();
              const last = content.lastElementChild;
              const heading = last && /^(H3|H4)$/.test(last.tagName) ? last : null;
              if (heading) heading.remove();
              newPage();
              if (heading) content.appendChild(heading);
              content.appendChild(table);
            }
          }
        } else if (node.matches(".ps-grid")){
          for (const card of [...node.children]){
            let grid, fragment;
            const cardPage = () => {
              grid = node.cloneNode(false);
              fragment = card.cloneNode(false);
              grid.appendChild(fragment);
              content.appendChild(grid);
            };
            cardPage();
            for (const section of [...card.children]){
              const units = section.tagName === "DL" ? [...section.children] : [section];
              let dl;
              for (const unit of units){
                if (section.tagName === "DL" && !dl){ dl = section.cloneNode(false); fragment.appendChild(dl); }
                (dl || fragment).appendChild(unit);
                if (!fits()){
                  unit.remove();
                  if (dl && !dl.children.length) dl.remove();
                  if (!fragment.children.length) grid.remove();
                  newPage();
                  cardPage();
                  const header = card.querySelector("header");
                  if (header && unit.tagName !== "HEADER") fragment.appendChild(header.cloneNode(true));
                  dl = section.tagName === "DL" ? section.cloneNode(false) : null;
                  if (dl) fragment.appendChild(dl);
                  (dl || fragment).appendChild(unit);
                }
              }
            }
          }
        } else if (node.matches("ul.doc-list")){
          const items = [...node.children];
          node.replaceChildren();
          let list = node;
          for (const item of items){
            if (!list.parentElement) append(list);
            list.appendChild(item);
            if (!fits()){
              item.remove();
              if (!list.children.length) list.remove();
              newPage();
              list = node.cloneNode(false);
              list.appendChild(item);
              content.appendChild(list);
            }
          }
        } else append(node);
      }
    }
    doc.replaceChildren(...pages.filter(p => p.firstElementChild?.children.length));
  } finally { measure.remove(); }
}

/* PDF export.
   Each block is rasterised separately so a card never splits across a page break.
   html2canvas lets the browser do the Hebrew and RTL shaping, which is why we
   capture the rendered DOM instead of drawing text into jsPDF by hand — jsPDF's
   built-in fonts carry no Hebrew glyphs. The document is always captured light. */
async function exportPdf(blocks, kind, btn){
  if (!blocks || !blocks.length) return;
  if (!window.html2canvas || !window.jspdf){
    note(btn, "ספריות הייצוא לא נטענו");
    return;
  }
  const label = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = "מייצא…"; }

  const root = document.documentElement;

  /* Pin the layout to a page-like width for the capture. Without this the PDF
     inherits whatever width the viewer's window happens to have, so the same
     report comes out cramped on a laptop and airy on a wide monitor. */
  const holder = blocks[0].closest(".doc") || blocks[0].parentElement;
  const prevCss = holder ? holder.getAttribute("style") : null;
  if (holder) holder.setAttribute("style", (prevCss ? prevCss + ";" : "") + "width:900px;max-width:none");
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const M = 12, availW = pw - M * 2, availH = ph - M * 2;
    let y = M, first = true;

    for (const el of blocks){
      const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff",
        logging: false, useCORS: true, windowWidth: 1200, width: el.offsetWidth });
      /* A .doc-block already carries the whole letterhead sheet, so it goes on
         the page edge to edge. Everything else is fitted inside the margins. */
      if (el.classList.contains("doc-block")){
        if (!first) pdf.addPage();
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pw, ph);
        y = M; first = false;
        continue;
      }
      /* Fit inside the page rather than forcing full width: a פסיקתה card is tall
         and narrow, and stretching it to the margins pushed it past A4 height. */
      let w = availW, h = canvas.height * availW / canvas.width;
      if (h > availH){ h = availH; w = canvas.width * h / canvas.height; }
      if (!first && y + h > ph - M){ pdf.addPage(); y = M; }
      /* JPEG keeps a multi-page report in the hundreds of KB instead of tens of MB */
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.9), "JPEG", (pw - w) / 2, y, w, h);
      y += h + 6;
      first = false;
    }

    const stamp = new Date().toISOString().slice(0, 10);
    const safeFilePart = value => String(value || "")
      .replace(/[\\/:*?"<>|]/g, "-")
      .replace(/\s+/g, " ")
      .trim();
    const coupleNames = state.people
      .map(person => safeFilePart(person.name))
      .filter(Boolean)
      .join(" ו");
    const fileName = kind === "opinion"
      ? `דוח איזון משאבים${coupleNames ? " - " + coupleNames : ""}.pdf`
      : (kind === "psiktot" ? "פסיקתות-" : "דוח-היוון-") + stamp + ".pdf";
    pdf.save(fileName);
    note(btn, "הקובץ הורד");
  } catch (err){
    note(btn, "הייצוא נכשל");
    if (framed) showPrintHelp();
  } finally {
    if (holder){ if (prevCss) holder.setAttribute("style", prevCss); else holder.removeAttribute("style"); }
    if (btn){ btn.disabled = false; setTimeout(() => { btn.textContent = label; }, 2200); }
  }

  function note(b, msg){ if (b) b.textContent = msg; }
}

/* Plain-text rendering of the whole opinion, for pasting into a document.
   Walks the rendered document so the text carries the same order and content
   as the PDF — chapters, tables, the פסיקתות and the closing summary. */
function serializeDoc(el, out){
  for (const n of el.children){
    const t = n.tagName;
    if (t === "H3"){ out.push("", "=== " + n.textContent.trim() + " ==="); }
    else if (t === "H4"){ out.push("", n.textContent.trim(), "-".repeat(n.textContent.trim().length)); }
    else if (t === "P"){ const x = n.textContent.trim(); if (x) out.push(x); }
    else if (t === "UL"){ [...n.children].forEach(li => out.push("• " + li.textContent.trim())); }
    else if (t === "TABLE"){
      [...n.querySelectorAll("tr")].forEach(tr =>
        out.push([...tr.children].map(c => c.textContent.trim()).filter(Boolean).join("  |  ")));
      out.push("");
    }
    else if (t === "DL"){
      [...n.children].forEach(d => {
        const dt = d.querySelector("dt"), dd = d.querySelector("dd");
        if (!dt) return;
        const val = dd ? dd.textContent.trim() : "";
        out.push(dt.textContent.trim() + (val ? " " + val : ""));
      });
    }
    else if (t === "ARTICLE"){ out.push("", "─".repeat(46)); serializeDoc(n, out); out.push("─".repeat(46)); }
    else if (n.children.length){ serializeDoc(n, out); }
    else { const x = n.textContent.trim(); if (x) out.push(x); }
  }
}

function opinionAsText(){
  const doc = $("#opinionDoc");
  if (!doc) return "";
  const out = [];
  serializeDoc(doc, out);
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function copyOpinionText(btn){
  const text = opinionAsText();
  if (!text){ if (btn) btn.textContent = "אין מה להעתיק"; return; }
  const label = btn ? btn.textContent : "";
  const done = ok => { if (btn){ btn.textContent = ok ? "הועתק ✓" : "ההעתקה נכשלה"; setTimeout(() => { btn.textContent = label; }, 2200); } };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  done(ok);
}

/* ---------------- events ---------------- */
document.addEventListener("change", e => {
  if (e.target.type === "checkbox" && e.target.dataset.c != null) handleField(e.target);
  if (e.target.type === "file" && /^file\d+$/.test(e.target.id)){
    intake(+e.target.id.replace("file", ""), e.target.files);
  }
});

/* קריאת הקבצים והחלתם על הצד המתאים. */
async function intake(i, fileList){
  if (!fileList || !fileList.length) return;
  const card = document.querySelector(`[data-drop="${i}"]`);
  if (card) card.classList.add("over");
  const busy = document.createElement("div");
  busy.className = "need-more";
  busy.setAttribute("role", "status");
  busy.textContent = "קורא את הקבצים… דוח שנשלח לקריאה ממוחשבת עשוי לקחת עד שתי דקות.";
  if (card) card.appendChild(busy);
  try {
    applyMaslaka(i, mergeMaslaka(await filesToResults([...fileList])));
    persist();
  } finally {
    busy.remove();
    if (card) card.classList.remove("over");
  }
  renderIntake(); renderPeople(); render();
}

/* גרירה אל כרטיס הצד. */
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest("[data-drop]");
  if (!d) return;
  e.preventDefault(); d.classList.add("over");
}));
document.addEventListener("dragleave", e => {
  const d = e.target.closest && e.target.closest("[data-drop]");
  if (d && !d.contains(e.relatedTarget)) d.classList.remove("over");
});
document.addEventListener("drop", e => {
  const d = e.target.closest && e.target.closest("[data-drop]");
  if (!d) return;
  e.preventDefault(); d.classList.remove("over");
  intake(+d.dataset.drop, e.dataTransfer && e.dataTransfer.files);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.classList) t.classList.remove("wizard-invalid");
  const wizardStatus = $("#wizardStatus");
  if (wizardStatus && wizardStatus.classList.contains("error")){ wizardStatus.textContent = `שלב ${wizardStep + 1} מתוך ${wizardLabels.length}: ${wizardLabels[wizardStep]}`; wizardStatus.classList.remove("error"); }
  if (["rate","breakDate","marriage","court","judge","caseNo","opinionDate",
       "retM","retF","lifeM","lifeF",
       "expName","expId","expAddr","expTitle","expCv","expLicenses"].indexOf(t.id) !== -1){
    if (t.id === "breakDate"){ const nv = normYmd(t.value); if (nv !== t.value) t.value = nv; state.people.forEach((_, i) => refreshMaslakaAdjustment(i)); renderIntake(); renderPeople(); }
    render(); return;
  }
  handleField(t);
});

function handleField(t){
  const pi = t.dataset.p;
  if (pi == null) return;
  const p = state.people[+pi];
  if (t.dataset.f != null){
    const f = p.funds[+t.dataset.f];
    f[t.dataset.k] = t.dataset.k === "amount" ? (Number(t.value) || 0) : t.value;
  } else if (t.dataset.b != null){
    const f = p.balances[+t.dataset.b];
    f[t.dataset.k] = t.dataset.k === "amount" ? (Number(t.value) || 0) : t.value;
  } else if (t.dataset.c != null){
    const f = p.capital[+t.dataset.c];
    f[t.dataset.k] = t.dataset.k === "amount" ? (Number(t.value) || 0)
                   : (t.dataset.k === "liquid" || t.dataset.k === "atRetire" || t.dataset.k === "exclude") ? t.checked : t.value;
  } else {
    p[t.dataset.k] = t.value;
    if (t.value) t.classList.remove("needs");
    if (t.dataset.k === "birth" || t.dataset.k === "gender") renderIntake();
  }
  persist();
  if (t.dataset.k === "name" && t.dataset.f == null && t.dataset.c == null && t.dataset.b == null){
    const h = t.closest(".person").querySelector(".person-head h3");
    if (h) h.textContent = t.value || "ללא שם";
  }
  render();
}

document.addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  if (add){
    state.people[+add.dataset.add].funds.push({ name: "", acct: "", amount: 0, opened: "", body: "", nikuim: "" });
    persist(); renderPeople(); render(); return;
  }
  const ab = e.target.closest("[data-addbal]");
  if (ab){ const q = state.people[+ab.dataset.addbal]; (q.balances = q.balances || []).push({ name: "", amount: 0 });
           persist(); renderPeople(); render(); return; }
  const ac = e.target.closest("[data-addcap]");
  if (ac){ const q = state.people[+ac.dataset.addcap]; (q.capital = q.capital || []).push({ name: "", amount: 0 });
           persist(); renderPeople(); render(); return; }
  const del = e.target.closest("[data-del]");
  if (del){
    const [i, j] = del.dataset.del.split(":").map(Number);
    if (state.people[i].funds.length > 1) state.people[i].funds.splice(j, 1);
    else state.people[i].funds[0] = { name: "", acct: "", amount: 0, opened: "", body: "", nikuim: "" };
    persist(); renderPeople(); render(); return;
  }
  const pick = e.target.closest("[data-pick]");
  if (pick){ const inp = $("#file" + pick.dataset.pick); if (inp) inp.click(); return; }
  const clr = e.target.closest("[data-clear]");
  if (clr){
    const q = state.people[+clr.dataset.clear];
    delete q.intake;
    persist(); renderIntake(); renderPeople(); render(); return;
  }
  const co = e.target.closest("[data-checkout]");
  if (co){ openCheckout(co.dataset.checkout); return; }
  if (e.target.id === "resetBtn"){ resetToSample(); return; }
  if (e.target.id === "copyOpinion" || e.target.id === "copyPsikta"){ copyOpinionText(e.target); return; }
  if (e.target.id === "pdfOpinion"){
    const blocked = state.people.find(p => p.intake && p.intake.blocked);
    if (blocked){ const status = $("#wizardStatus"); if (status){ status.textContent = `${blocked.tag}: דוח המסלקה אינו מתאים למועד הקרע`; status.classList.add("error"); } return; }
    exportPdf([...document.querySelectorAll("#opinionDoc .doc-block")], "opinion", e.target); return;
  }
  if (e.target.id === "printOpinion"){ printReport(false); return; }
  if (e.target.id === "pdfReport"){ exportPdf([...document.querySelectorAll(".locked-body .breakdown")], "report", e.target); return; }
  if (e.target.id === "printBtn"){ printReport(false); return; }
});

$("#modeSolo").addEventListener("click", () => setMode("solo", "a"));
$("#modeSoloB").addEventListener("click", () => setMode("solo", "b"));

$("#wizardBack").addEventListener("click", goWizardBack);
function setMode(m, holder){
  state.mode = m;
  state.rightsHolder = holder;
  $("#modeCouple").setAttribute("aria-pressed", String(holder === "both"));
  $("#modeSolo").setAttribute("aria-pressed", String(holder === "a"));

  updateWizard();
}

/* checkout — no payment provider is wired up yet */
const modal = $("#checkoutModal");
window.addEventListener("message", e => {
  if (e.source === window.parent && e.data && e.data.type === "nk-unlock") unlockDemo();
  if (e.source === window.parent && e.data && e.data.type === "nk-show-admin-preview") showAdminPreview();
  if (e.source === window.parent && e.data && e.data.type === "nk-error") alert(e.data.message);
});
function openCheckout(kind){
  if (window.parent !== window){ window.parent.postMessage({ type: "nk-request-unlock" }, "*"); return; }
  if (kind === "demo"){ unlockDemo(); return; }
  $("#modalText").textContent =
    "עמוד התשלום עדיין לא חובר לספק סליקה, ולכן לא נגבה כאן תשלום. אפשר לפתוח את חוות הדעת לצפייה מלאה.";
  modal.setAttribute("open", "");
}
function unlockDemo(){
  state.unlocked = true;
  modal.removeAttribute("open");
  render();
  const r = $("#results");
  if (r) r.scrollIntoView({ behavior: "smooth", block: "start" });
}
function showAdminPreview(){
  const sourcePages = [...document.querySelectorAll("#opinionDoc .doc-block")];
  if (!sourcePages.length){ alert("יש להשלים את נתוני הדוח לפני פתיחת התצוגה המקדימה."); return; }
  let preview = $("#reportPreview");
  if (preview) preview.remove();
  preview = document.createElement("div");
  preview.id = "reportPreview";
  preview.className = "report-preview";
  preview.setAttribute("role", "dialog");
  preview.setAttribute("aria-modal", "true");
  preview.setAttribute("aria-labelledby", "reportPreviewTitle");
  preview.innerHTML = `
    <div class="report-preview-bar">
      <div><div class="report-preview-title" id="reportPreviewTitle">תצוגה מקדימה לפני הפקה</div><div class="report-preview-count" id="reportPreviewCount"></div></div>
      <button class="btn btn-ghost" type="button" id="closeReportPreview">סגירה</button>
    </div>
    <div class="report-preview-stage"><div class="report-preview-page" id="reportPreviewPage"></div></div>
    <div class="report-preview-actions">
      <button class="btn btn-ghost" type="button" id="previewPrev">העמוד הקודם</button>
      <button class="btn btn-ghost" type="button" id="previewNext">העמוד הבא</button>
      <label class="report-preview-check"><input type="checkbox" id="previewApproved"> בדקתי שהכותרות והעימוד תקינים בכל העמודים</label>
      <button class="btn btn-brass" type="button" id="approveReportPreview" disabled>אישור והפקת הדוח</button>
    </div>`;
  document.body.appendChild(preview);
  document.body.style.overflow = "hidden";
  let pageIndex = 0;
  const page = $("#reportPreviewPage");
  const count = $("#reportPreviewCount");
  const prev = $("#previewPrev");
  const next = $("#previewNext");
  const approved = $("#previewApproved");
  const approve = $("#approveReportPreview");
  function drawPreviewPage(){
    const stage = $(".report-preview-stage");
    page.style.zoom = Math.min(1, Math.max(0.2, (stage.clientWidth - 48) / 900));
    page.replaceChildren(sourcePages[pageIndex].cloneNode(true));
    count.textContent = `עמוד ${pageIndex + 1} מתוך ${sourcePages.length}`;
    prev.disabled = pageIndex === 0;
    next.disabled = pageIndex === sourcePages.length - 1;
    $(".report-preview-stage").scrollTop = 0;
  }
  function closePreview(){ preview.remove(); document.body.style.overflow = ""; }
  prev.addEventListener("click", () => { if (pageIndex > 0){ pageIndex--; drawPreviewPage(); } });
  next.addEventListener("click", () => { if (pageIndex < sourcePages.length - 1){ pageIndex++; drawPreviewPage(); } });
  approved.addEventListener("change", () => { approve.disabled = !approved.checked; });
  $("#closeReportPreview").addEventListener("click", closePreview);
  approve.addEventListener("click", () => { closePreview(); window.parent.postMessage({ type: "nk-admin-preview-approved" }, "*"); });
  preview.setAttribute("open", "");
  drawPreviewPage();
  $("#closeReportPreview").focus();
}
$("#modalClose").addEventListener("click", () => modal.removeAttribute("open"));
$("#modalDemo").addEventListener("click", unlockDemo);
modal.addEventListener("click", e => { if (e.target === modal) modal.removeAttribute("open"); });

/* Printing.
   Inside an embedded viewer the page runs in a sandboxed frame, which swallows
   window.print() without raising anything, so when framed we say so instead. */
/* The app itself hosts this page in a same-origin frame, where print works;
   only a host page that is framed again (an embedded viewer) blocks it. */
const framed = (() => { try { return window.parent !== window && window.parent.self !== window.top; } catch (e) { return true; } })();

function printReport(psiktaOnly){
  document.body.classList.toggle("print-psikta", !!psiktaOnly);
  if (framed){
    showPrintHelp();
    document.body.classList.remove("print-psikta");
    return;
  }
  window.print();
  setTimeout(() => document.body.classList.remove("print-psikta"), 0);
}

function showPrintHelp(){
  let el = $("#printHelp");
  if (!el){
    el = document.createElement("div");
    el.id = "printHelp";
    el.className = "print-help";
    el.innerHTML = `
      <strong>הדפסה והורדה חסומות בתצוגה המוטמעת.</strong>
      עמוד שרץ בתוך מסגרת מוגנת אינו רשאי ליזום הורדת קובץ או הדפסה — הגבלה של הסביבה, לא של הקובץ.
      ייצוא ה-PDF יעבוד כרגיל כשהאתר מפורסם בכתובת משלו, וגם אם תפתחו את קובץ ה-HTML ישירות מהמחשב.
      <div class="ph-actions">
        <button class="btn btn-brass" id="copyOpinion">העתקת חוות הדעת כטקסט</button>
        <button class="link-btn" id="closePrintHelp">סגירה</button>
      </div>`;
    document.body.appendChild(el);
    el.addEventListener("click", ev => {
      if (ev.target.id === "closePrintHelp") el.remove();
    });
  }
}

render();
