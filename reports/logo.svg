<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" width="960" height="462" role="img" aria-label="יפתח ונגר — ייעוץ השקעות וייעוץ פנסיוני אובייקטיבי">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c79b45"/>
      <stop offset=".45" stop-color="#e8c161"/>
      <stop offset="1" stop-color="#f4d987"/>
    </linearGradient>
  </defs>

  <!-- wordmark: פתח ונגר  (the leading י is drawn by the chart's descending stroke) -->
  <text x="648" y="330" direction="rtl" text-anchor="start"
        font-family="Heebo, Assistant, Rubik, sans-serif" font-weight="700"
        font-size="140" letter-spacing="2" fill="url(#gold)">פתח ונגר</text>

  <!-- the letter י, doubling as the chart's opening stroke -->
  <polygon points="654.4,344.2 631.6,331.8 753.9,120.6 766.1,127.4" fill="url(#gold)"/>

  <!-- chart line -->
  <polyline points="760,124 848,236 926,42" fill="none" stroke="url(#gold)"
            stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- baseline -->
  <rect x="668" y="266" width="272" height="12" rx="3" fill="url(#gold)"/>

  <!-- tagline -->
  <text x="480" y="432" direction="rtl" text-anchor="middle"
        font-family="Heebo, Assistant, Rubik, sans-serif" font-weight="400"
        font-size="47" letter-spacing="1" fill="#8f9099">ייעוץ השקעות וייעוץ פנסיוני אובייקטיבי</text>
</svg>
